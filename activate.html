<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<title>Onix Finance — Activate Account</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=DM+Sans:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
<script src="i18n.js?v=2"></script>
<style>.lang-toggle{display:flex;gap:4px;justify-content:flex-end;margin-bottom:14px}.lang-toggle button{padding:4px 10px;border-radius:2px;font-size:.68rem;font-weight:700;letter-spacing:.08em;color:var(--light);border:1px solid var(--border);background:none;cursor:pointer}.lang-toggle button.active{background:#C0392B;color:#fff;border-color:#C0392B}</style>
<style>
:root{
  --red:#C0392B;--dark:#1A1A1A;--bg:#F8F7F5;--border:#E8E8E8;
  --muted:#6B6560;--light:#9B9590;--red-light:#FDF0EE;
  --success:#3B8B3B;--success-bg:#EBF5EB;
  --serif:'Cormorant Garamond',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--dark);min-height:100vh;background:var(--bg);
     display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:440px;background:#fff;border:1px solid var(--border);
      border-top:3px solid var(--red);padding:44px 40px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:30px}
.eyebrow{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--red);font-weight:600;margin-bottom:12px}
h1{font-family:var(--serif);font-style:italic;font-weight:500;font-size:2.1rem;line-height:1.05;margin-bottom:10px}
.sub{color:var(--light);font-size:.9rem;margin-bottom:28px;line-height:1.6}
.field-label{display:block;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}
.field-input{width:100%;padding:13px 14px;border:1px solid var(--border);background:#fff;font-size:.9rem;font-family:var(--sans);color:var(--dark);outline:none;border-radius:2px;transition:border-color .15s}
.field-input:focus{border-color:var(--red)}
.field-input:disabled{background:#f4f4f4;color:var(--muted);cursor:not-allowed}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;font-size:.78rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border-radius:2px;border:1px solid var(--red);background:var(--red);color:#fff;cursor:pointer;transition:background .15s}
.btn:hover{background:#a93226}
.btn:disabled{opacity:.6;cursor:not-allowed}
.msg{display:none;font-size:.85rem;padding:12px 14px;margin-bottom:18px;line-height:1.5}
.msg.err{display:block;color:var(--red);background:var(--red-light);border-left:3px solid var(--red)}
.msg.ok{display:block;color:var(--success);background:var(--success-bg);border-left:3px solid var(--success)}
.hint{font-size:.72rem;color:var(--light);margin-top:8px}
.foot{margin-top:26px;text-align:center;font-size:.72rem;color:#bbb;font-style:italic}
.center{text-align:center}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="assets/onix-logo.png" alt="Onix Finance" style="display:block;height:32px;width:auto;max-width:150px" />
    </div>

    <div class="lang-toggle">
      <button type="button" data-lang-set="en" class="active">EN</button>
      <button type="button" data-lang-set="es">ES</button>
    </div>

    <div id="loading" class="center" style="padding:20px 0">
      <div class="sub" style="margin:0" data-en="Verifying your link…" data-es="Verificando su enlace…">Verifying your link…</div>
    </div>

    <div id="content" style="display:none">
      <p class="eyebrow" data-en="Account Activation" data-es="Activación de Cuenta">Account Activation</p>
      <h1 data-en="Set your password" data-es="Establezca su contraseña">Set your password</h1>
      <p class="sub" data-en="Create a password to access your Onix Finance client portal." data-es="Cree una contraseña para acceder a su portal de cliente de Onix Finance.">Create a password to access your Onix Finance client portal.</p>

      <div id="msg" class="msg"></div>

      <form id="form">
        <label class="field-label" data-en="Name" data-es="Nombre">Name</label>
        <input id="name" type="text" class="field-input" disabled style="margin-bottom:18px">

        <label class="field-label" data-en="Email" data-es="Correo">Email</label>
        <input id="email" type="text" class="field-input" disabled style="margin-bottom:18px">

        <label class="field-label" data-en="New Password" data-es="Nueva Contraseña">New Password</label>
        <input id="password" type="password" class="field-input" data-ph-en="At least 8 characters" data-ph-es="Al menos 8 caracteres" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" maxlength="72" required style="margin-bottom:6px">
        <div class="hint" data-en="Minimum 8 characters." data-es="Mínimo 8 caracteres.">Minimum 8 characters.</div>

        <label class="field-label" style="margin-top:18px" data-en="Confirm Password" data-es="Confirmar Contraseña">Confirm Password</label>
        <input id="confirm" type="password" class="field-input" data-ph-en="Re-enter password" data-ph-es="Vuelva a ingresar la contraseña" placeholder="Re-enter password" autocomplete="new-password" maxlength="72" required style="margin-bottom:24px">

        <button id="submit" type="submit" class="btn">
          <span id="submit-label" data-en="Activate Account" data-es="Activar Cuenta">Activate Account</span>
        </button>
      </form>
    </div>

    <div id="invalid" style="display:none">
      <p class="eyebrow" data-en="Account Activation" data-es="Activación de Cuenta">Account Activation</p>
      <h1 data-en="Link unavailable" data-es="Enlace no disponible">Link unavailable</h1>
      <p class="sub" id="invalid-msg"></p>
      <a class="btn" href="login.html" style="text-decoration:none" data-en="Go to Sign In" data-es="Ir al Inicio de Sesión">Go to Sign In</a>
    </div>

    <p class="foot">Private &amp; Confidential — Onix Finance, LLC</p>
  </div>

<script>
const SUPABASE_URL = 'https://ckayfqplkpplgojdhjlu.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNrYXlmcXBsa3BwbGdvamRoamx1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwOTUzNDUsImV4cCI6MjA5MzY3MTM0NX0.E5lmNud0ERUqaxy829d1dB3AqGw9EEFjHFSB7zDJdFE';
const FN = SUPABASE_URL + '/functions/v1/activate-client-account';
const HEADERS = { 'apikey': ANON_KEY, 'Authorization': 'Bearer ' + ANON_KEY };

const params = new URLSearchParams(location.search);
const token = params.get('token') || '';
// The email link carries the client's preferred language.
if (params.get('lang') === 'es' || params.get('lang') === 'en') OnixLang.setLang(params.get('lang'));

const $ = (id) => document.getElementById(id);
// Messages set from JS follow the current EN/ES toggle.
function setText(el, en, es) {
  el.setAttribute('data-en', en);
  el.setAttribute('data-es', es);
  el.textContent = OnixLang.getLang() === 'es' ? es : en;
}
function showMsg(en, es, kind) {
  const el = $('msg');
  setText(el, en, es);
  el.className = 'msg ' + (kind === 'ok' ? 'ok' : 'err');
}

const LINK_REASONS = {
  used:      ['This link has already been used. Please sign in, or use "Forgot password" on the sign-in page.',
              'Este enlace ya fue utilizado. Inicie sesión o use "¿Olvidó su contraseña?" en la página de inicio de sesión.'],
  expired:   ['This link has expired. Contact Onix Finance and we will send you a new one.',
              'Este enlace ha vencido. Contacte a Onix Finance y le enviaremos uno nuevo.'],
  revoked:   ['This link is no longer valid. If you received a newer email from us, use the link in that one.',
              'Este enlace ya no es válido. Si recibió un correo más reciente de nosotros, use el enlace de ese correo.'],
  not_found: ['This link is not valid. Please check that you copied the whole link from the email.',
              'Este enlace no es válido. Verifique que copió el enlace completo del correo.']
};
function showInvalid(reason) {
  const [en, es] = LINK_REASONS[reason] || LINK_REASONS.not_found;
  $('loading').style.display = 'none';
  $('content').style.display = 'none';
  $('invalid').style.display = 'block';
  setText($('invalid-msg'), en, es);
}

async function init() {
  if (!token) { showInvalid('not_found'); return; }
  try {
    const res = await fetch(FN + '?token=' + encodeURIComponent(token), { headers: HEADERS });
    const data = await res.json();
    if (!data.valid) { showInvalid(data.reason); return; }
    $('name').value = data.full_name || '';
    $('email').value = data.email || '';
    $('loading').style.display = 'none';
    $('content').style.display = 'block';
  } catch (e) {
    $('loading').style.display = 'none';
    $('invalid').style.display = 'block';
    setText($('invalid-msg'), 'Could not verify your link. Please try again in a few minutes.',
                              'No se pudo verificar su enlace. Intente de nuevo en unos minutos.');
  }
}

function resetButton() {
  $('submit').disabled = false;
  setText($('submit-label'), 'Activate Account', 'Activar Cuenta');
}

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = $('password').value;
  if (pw.length < 8) { showMsg('Password must be at least 8 characters.', 'La contraseña debe tener al menos 8 caracteres.', 'err'); return; }
  if (pw !== $('confirm').value) { showMsg('Passwords do not match.', 'Las contraseñas no coinciden.', 'err'); return; }

  $('submit').disabled = true;
  $('submit-label').innerHTML = '<span class="spinner"></span>';
  try {
    const res = await fetch(FN, {
      method: 'POST',
      headers: { ...HEADERS, 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password: pw })
    });
    const data = await res.json();
    if (!res.ok || data.error) {
      const err = String(data.error || '');
      if (err.startsWith('link_')) { showInvalid(err.slice(5)); return; }
      if (err === 'password_rejected') {
        showMsg('That password was not accepted. Please choose a different, stronger password.',
                'Esa contraseña no fue aceptada. Elija una contraseña diferente y más segura.', 'err');
      } else {
        showMsg('Could not activate your account. Please try again.',
                'No se pudo activar su cuenta. Intente de nuevo.', 'err');
      }
      resetButton();
      return;
    }
    $('form').style.display = 'none';
    showMsg('Your account is active. Redirecting you to sign in…',
            'Su cuenta está activa. Redirigiéndolo al inicio de sesión…', 'ok');
    setTimeout(() => { location.href = 'login.html'; }, 2200);
  } catch (e) {
    showMsg('Network error. Please try again.', 'Error de red. Intente de nuevo.', 'err');
    resetButton();
  }
});

init();
</script>
</body>
</html>
