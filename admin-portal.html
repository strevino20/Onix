<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- Always re-validate HTML so the latest ?v=N JS reference is picked up
       immediately after a deploy. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Onix Finance — Admin Console</title>
  <!-- Eliminate horizontal scroll on the dashboard (and elsewhere). The
       bundled HTML uses repeat(N,1fr) grids whose children default to
       min-width:auto, which can force the row wider than the viewport when
       a chart canvas or wide table is inside. Allow grid items to shrink. -->
  <style>
    html, body { overflow-x: hidden !important; }
    .main { overflow-x: hidden; min-width: 0; }
    .row-2, .row-3, .kpi-grid, .col-4, .col-3, .col-2 { min-width: 0; }
    .row-2 > *, .row-3 > *, .kpi-grid > * { min-width: 0; }
    .card, .dash-card { min-width: 0; overflow: hidden; }
    /* Containment: clip chart canvases at the card boundary no matter what
       inline width Chart.js thinks the canvas should be. We hit both the card
       and any direct-child div (the typical Chart.js wrapper) with
       overflow:hidden so even a stale canvas width can't bleed out of the
       dashboard. position:relative on chart wrappers lets Chart.js measure
       correctly on resize. */
    .card { overflow: hidden !important; }
    .card > div { position: relative; overflow: hidden !important; }
    .card canvas { max-width: 100% !important; display: block; }
    /* Any table wider than its card scrolls inside the card, not the page. */
    .card table.tbl { width: 100%; table-layout: auto; }
    .card > table.tbl, .card .tbl-wrap { display: block; overflow-x: auto; max-width: 100%; }
  </style>
  <script>
  /* Defensive chart resize. The bundled dashboard uses Chart.js v3+, where
     Chart.instances no longer exists — you have to look up each chart by its
     canvas via Chart.getChart(canvas). After a window shrink/expand, some
     charts (especially pie/doughnut) don't re-fit their card. We:
       1. Listen for window resize / focus / visibility — call .resize() on
          every chart we can find (throttled with rAF).
       2. Install a ResizeObserver on each chart's parent the first time we
          see it, so any container size change triggers a chart resize. This
          catches cases that the window-resize event misses (sidebar collapse,
          drawer open/close, etc.). */
  (function(){
    var pending = false;
    function findChartForCanvas(canvas){
      // v3+ API
      try {
        if (typeof Chart.getChart === 'function') {
          var ch = Chart.getChart(canvas);
          if (ch) return ch;
        }
      } catch(e){}
      // v2 fallback: iterate Chart.instances (an object keyed by chart id)
      try {
        if (Chart.instances) {
          var keys = Object.keys(Chart.instances);
          for (var i = 0; i < keys.length; i++) {
            if (Chart.instances[keys[i]].canvas === canvas) return Chart.instances[keys[i]];
          }
        }
      } catch(e){}
      return null;
    }
    function resizeAllCharts(){
      if (typeof Chart === 'undefined') return;
      document.querySelectorAll('canvas').forEach(function(canvas){
        var ch = findChartForCanvas(canvas);
        if (ch && typeof ch.resize === 'function') {
          try { ch.resize(); } catch(e){}
        }
      });
    }
    function nudge(){
      if (pending) return;
      pending = true;
      // Two rAFs + a tiny timeout so layout has fully settled before we
      // ask Chart.js to remeasure (especially after window restore).
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          setTimeout(function(){ pending = false; resizeAllCharts(); }, 50);
        });
      });
    }
    window.addEventListener('resize', nudge);
    window.addEventListener('focus', nudge);
    document.addEventListener('visibilitychange', function(){ if (!document.hidden) nudge(); });

    // Observe each chart's parent so we react to any container size change,
    // not just window resize. New canvases get observed as they appear.
    if (typeof ResizeObserver !== 'undefined') {
      var ro = new ResizeObserver(function(){ nudge(); });
      function wireObservers(){
        document.querySelectorAll('canvas').forEach(function(canvas){
          var parent = canvas.parentElement;
          if (parent && !parent.__onixRoObserved) {
            parent.__onixRoObserved = true;
            ro.observe(parent);
          }
        });
      }
      // Initial sweep + periodic rewire for charts mounted by the bundle later.
      setTimeout(wireObservers, 800);
      setInterval(wireObservers, 3000);
    }
  })();
  </script>
  <script>
  /* Auth gate — bounce to login if no admin session */
  (function(){
    try {
      var u = JSON.parse(localStorage.getItem('onix-user') || 'null');
      if (!u || !['admin', 'manager'].includes(u.role)) { window.location.replace('login.html'); }
    } catch(e) { window.location.replace('login.html'); }
  })();

  /* ============================================================
     Role permissions — single source of truth for what each title
     (admin / manager / ae) is allowed to do. The "Role Permissions"
     chart on the Team & Settings page is a visual mirror of this
     same MATRIX, not a separate definition — keep them in sync here.
     ============================================================ */
  window.OnixPerms = (function(){
    var MATRIX = {
      admin:   {manageUsers:true,  addClients:true,  removeClients:true,  viewProjects:true, editContent:true,  billing:true},
      manager: {manageUsers:false, addClients:true,  removeClients:false, viewProjects:true, editContent:true,  billing:true},
      ae:      {manageUsers:false, addClients:false, removeClients:false, viewProjects:true, editContent:false, billing:false}
    };
    function currentTitle(){
      try {
        var u = JSON.parse(localStorage.getItem('onix-user') || 'null');
        if (!u) return 'admin';
        // role='manager' is stored directly in the DB — check it first
        if (u.role === 'manager') return 'manager';
        // AEs have role='admin' but title='ae' in their profile
        return (u.title === 'ae') ? 'ae' : 'admin';
      } catch(e) { return 'admin'; }
    }
    function can(key){
      var t = currentTitle();
      return !!(MATRIX[t] && MATRIX[t][key]);
    }
    function applyBodyClasses(){
      if (!document.body) return;
      document.body.classList.toggle('onix-no-manage-users',   !can('manageUsers'));
      document.body.classList.toggle('onix-no-remove-clients', !can('removeClients'));
      document.body.classList.toggle('onix-no-edit-content',   !can('editContent'));
    }
    // The bundler replaces document.head wholesale after load (see the
    // "Lock-the-viewport layout" comment below), which would wipe out a
    // plain <style> tag written into the original <head>. So this CSS is
    // injected via JS and re-checked on the same schedule as that other
    // workaround, instead of living in the static <style> block above.
    function injectPermCss(){
      if (document.getElementById('__onix_perm_css')) return;
      if (!document.head) return;
      var s = document.createElement('style');
      s.id = '__onix_perm_css';
      s.textContent =
        'body.onix-no-manage-users .__onix_role_select,' +
        'body.onix-no-manage-users [data-onix-remove]{display:none !important}' +
        'body.onix-no-remove-clients [data-pending-act="reject"],' +
        'body.onix-no-remove-clients #oac-bulk-reject{display:none !important}' +
        'body.onix-no-edit-content [data-edit-loan],' +
        'body.onix-no-edit-content [data-edit-inv],' +
        'body.onix-no-edit-content [data-edit-raise],' +
        'body.onix-no-edit-content [data-doc-remove],' +
        'body.onix-no-edit-content [data-doc-add-form]{display:none !important}';
      document.head.appendChild(s);
    }
    function applyAll(){ injectPermCss(); applyBodyClasses(); }
    document.addEventListener('DOMContentLoaded', applyAll);
    window.addEventListener('load', applyAll);
    // The admin bundle injects/re-injects markup (and replaces <head>) well
    // after window.load (see the 1500-2000ms setTimeouts throughout this
    // file), so keep re-applying to cover late-rendered buttons/rows and a
    // head swap that drops our injected <style>.
    setInterval(applyAll, 2000);
    return { MATRIX: MATRIX, currentTitle: currentTitle, can: can, applyBodyClasses: applyBodyClasses };
  })();

  /* Lock-the-viewport layout — sidebar + top-bar stay anchored, only the
     right column (main content) scrolls. The Bolt bundler overwrites the
     <head> when it unpacks the template, so the override has to be injected
     after that into the freshly-replaced document.head. !important on each
     declaration so we win the cascade regardless of order. */
  window.addEventListener('load', function(){
    function inject(){
      if (document.getElementById('__onix_lock_layout')) return;
      var s = document.createElement('style');
      s.id = '__onix_lock_layout';
      s.textContent =
        'html,body{height:100% !important;overflow:hidden !important}' +
        '.app{height:100vh !important;min-height:0 !important;overflow:hidden !important}' +
        '.sidebar{height:100vh !important;overflow-y:auto !important}' +
        '.app > div{height:100vh !important;overflow-y:auto !important}';
      document.head.appendChild(s);
    }
    // Run repeatedly for the first couple of seconds — the bundler may unpack
    // after our load handler fires, in which case our first injection gets
    // wiped by replaceWith.
    var tries = 0;
    function attempt(){
      tries++;
      if (!document.getElementById('__onix_lock_layout')) inject();
      if (tries < 30) setTimeout(attempt, 200);
    }
    attempt();
  });

  /* Favicon — same document.head-gets-replaced-wholesale problem as the
     lock-layout override above, so injected the same way: retry until it
     survives the bundler's head swap. A plain <link> in this original
     <head> would get wiped the same way a plain <style> tag would. */
  window.addEventListener('load', function(){
    function inject(){
      if (document.getElementById('__onix_favicon_32')) return;
      var icon32 = document.createElement('link');
      icon32.id = '__onix_favicon_32';
      icon32.rel = 'icon';
      icon32.type = 'image/png';
      icon32.setAttribute('sizes', '32x32');
      icon32.href = 'assets/favicon-32.png';
      document.head.appendChild(icon32);

      var icon16 = document.createElement('link');
      icon16.rel = 'icon';
      icon16.type = 'image/png';
      icon16.setAttribute('sizes', '16x16');
      icon16.href = 'assets/favicon-16.png';
      document.head.appendChild(icon16);

      var appleIcon = document.createElement('link');
      appleIcon.rel = 'apple-touch-icon';
      appleIcon.href = 'assets/apple-touch-icon.png';
      document.head.appendChild(appleIcon);
    }
    var tries = 0;
    function attempt(){
      tries++;
      if (!document.getElementById('__onix_favicon_32')) inject();
      if (tries < 30) setTimeout(attempt, 200);
    }
    attempt();
  });


  /* New Client flow — intercept clicks on the "+ New Client" button and
     show an intermediary modal that asks for Investor / Lender / Borrower,
     then collects basic details and persists to localStorage. */
  window.addEventListener('load', function(){
    function findNewClientBtn() {
      return [].slice.call(document.querySelectorAll('button')).find(function(b){
        return /\+\s*(New|Nuevo)\s*(Client|Cliente)/i.test(b.textContent || '');
      });
    }

    function inject() {
      if (document.getElementById('__onix_addclient_styles')) return;
      var s = document.createElement('style');
      s.id = '__onix_addclient_styles';
      s.textContent = [
        '#__onix_modal{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;background:rgba(20,20,20,.55);backdrop-filter:blur(3px);font-family:"DM Sans",-apple-system,BlinkMacSystemFont,sans-serif;color:#1A1A1A}',
        '#__onix_modal.show{display:flex;animation:__onix_fade .18s ease-out}',
        '@keyframes __onix_fade{from{opacity:0}to{opacity:1}}',
        '#__onix_modal .om-card{background:#fff;width:480px;max-width:calc(100vw - 32px);border-top:3px solid #C0392B;padding:32px 36px 28px;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:__onix_pop .22s cubic-bezier(.2,.8,.2,1)}',
        '@keyframes __onix_pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}',
        '#__onix_modal .om-eyebrow{font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:#C0392B;font-weight:600;margin-bottom:10px}',
        '#__onix_modal h2{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;font-size:1.9rem;line-height:1.05;margin-bottom:6px;letter-spacing:-.005em}',
        '#__onix_modal .om-sub{color:#9B9590;font-size:.86rem;margin-bottom:22px}',
        '#__onix_modal .om-types{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}',
        '#__onix_modal .om-type{background:#F8F7F5;border:1px solid #E8E8E8;border-radius:2px;padding:16px 12px 14px;text-align:left;cursor:pointer;transition:all .14s;display:flex;flex-direction:column;gap:6px}',
        '#__onix_modal .om-type:hover{border-color:#C0392B;background:#FDF0EE}',
        '#__onix_modal .om-type.sel{border-color:#C0392B;background:#FDF0EE;box-shadow:inset 0 0 0 1px #C0392B}',
        '#__onix_modal .om-type b{font-size:.86rem;font-weight:700;color:#1A1A1A;letter-spacing:.01em}',
        '#__onix_modal .om-type span{font-size:.7rem;color:#6B6560;line-height:1.4}',
        '#__onix_modal .om-type .om-tgt{font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:#9B9590;margin-top:4px;font-weight:600}',
        '#__onix_modal .om-type.sel .om-tgt{color:#C0392B}',
        '#__onix_modal label{display:block;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:#6B6560;font-weight:700;margin-bottom:6px;margin-top:14px}',
        '#__onix_modal label:first-of-type{margin-top:0}',
        '#__onix_modal input{width:100%;padding:11px 13px;border:1px solid #E8E8E8;background:#fff;font-size:.88rem;font-family:inherit;color:#1A1A1A;outline:none;border-radius:2px;transition:border-color .15s}',
        '#__onix_modal input:focus{border-color:#C0392B}',
        '#__onix_modal .om-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}',
        '#__onix_modal .om-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px;padding-top:18px;border-top:1px solid #f0f0f0}',
        '#__onix_modal button.om-btn{padding:10px 18px;font-size:.74rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:2px;border:1px solid transparent;cursor:pointer;font-family:inherit;transition:all .15s}',
        '#__onix_modal button.om-cancel{background:transparent;color:#888;border-color:#E8E8E8}',
        '#__onix_modal button.om-cancel:hover{border-color:#C0392B;color:#C0392B}',
        '#__onix_modal button.om-submit{background:#C0392B;color:#fff;border-color:#C0392B}',
        '#__onix_modal button.om-submit:hover{background:#a93226}',
        '#__onix_modal button.om-submit:disabled{opacity:.4;cursor:not-allowed;background:#C0392B}',
        '#__onix_toast{position:fixed;left:50%;top:24px;transform:translateX(-50%) translateY(-12px);background:#1A1A1A;color:#fff;padding:14px 22px;border-left:3px solid #3B8B3B;border-radius:2px;font:500 .85rem/1.4 "DM Sans",-apple-system,sans-serif;box-shadow:0 12px 32px rgba(0,0,0,.4);z-index:99999;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:400px}',
        '#__onix_toast.show{opacity:1;transform:translateX(-50%) translateY(0)}',
        '#__onix_toast b{color:#C0392B;font-weight:700}'
      ].join('\n');
      document.head.appendChild(s);

      var m = document.createElement('div');
      m.id = '__onix_modal';
      m.innerHTML = ''
        + '<div class="om-card" role="dialog" aria-modal="true" aria-labelledby="om-title">'
        + '  <div class="om-eyebrow">Onboarding</div>'
        + '  <h2 id="om-title">Add a new client</h2>'
        + '  <p class="om-sub">Choose where this client belongs — we will create their account and route them to the right section.</p>'
        + '  <div class="om-types" role="radiogroup" aria-label="Client type" style="grid-template-columns:repeat(2,1fr)">'
        + '    <button class="om-type" data-type="borrower" role="radio" aria-checked="false">'
        + '      <b>Borrower</b><span>Receives loan capital</span><span class="om-tgt">→ Borrowers section</span>'
        + '    </button>'
        + '    <button class="om-type" data-type="investor" role="radio" aria-checked="false">'
        + '      <b>Investor</b><span>LP / capital provider</span><span class="om-tgt">→ LPs / Investors section</span>'
        + '    </button>'
        + '  </div>'
        + '  <form id="om-form" autocomplete="off">'
        + '    <div class="om-row">'
        + '      <div><label>First Name</label><input name="first" required></div>'
        + '      <div><label>Last Name</label><input name="last" required></div>'
        + '    </div>'
        + '    <label>Email</label><input name="email" type="email" required>'
        + '    <label>Phone (optional)</label><input name="phone" type="tel">'
        + '    <div class="om-actions">'
        + '      <button type="button" class="om-btn om-cancel">Cancel</button>'
        + '      <button type="submit" class="om-btn om-submit" disabled>Add Contact</button>'
        + '    </div>'
        + '  </form>'
        + '</div>';
      document.body.appendChild(m);

      var toast = document.createElement('div');
      toast.id = '__onix_toast';
      document.body.appendChild(toast);

      var selectedType = null;
      var typeBtns = m.querySelectorAll('.om-type');
      var submitBtn = m.querySelector('.om-submit');
      var form = m.querySelector('#om-form');

      typeBtns.forEach(function(b){
        b.addEventListener('click', function(e){
          e.preventDefault();
          selectedType = b.getAttribute('data-type');
          typeBtns.forEach(function(x){
            x.classList.toggle('sel', x === b);
            x.setAttribute('aria-checked', x === b ? 'true' : 'false');
          });
          submitBtn.disabled = false;
        });
      });

      function close(){
        m.classList.remove('show');
        form.reset();
        selectedType = null;
        submitBtn.disabled = true;
        typeBtns.forEach(function(x){ x.classList.remove('sel'); x.setAttribute('aria-checked','false'); });
      }
      m.querySelector('.om-cancel').addEventListener('click', close);
      m.addEventListener('click', function(e){ if (e.target === m) close(); });
      document.addEventListener('keydown', function(e){
        if (e.key === 'Escape' && m.classList.contains('show')) close();
      });

      // Generate a readable temp password the admin can hand off.
      function makeTempPassword(){
        var letters = 'ABCDEFGHJKMNPQRSTUVWXYZ';
        var lower   = 'abcdefghijkmnpqrstuvwxyz';
        var digits  = '23456789';
        function pick(s,n){ var o=''; for(var i=0;i<n;i++) o+=s[Math.floor(Math.random()*s.length)]; return o; }
        return 'Onix-' + pick(letters,2) + pick(lower,3) + pick(digits,4);
      }
      function esc(s){ return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

      form.addEventListener('submit', async function(e){
        e.preventDefault();
        if (!selectedType) return;
        if (!window.OnixDB || !OnixDB.client) {
          alert('Supabase is not ready yet — please try again in a moment.');
          return;
        }
        var fd = new FormData(form);
        var first = (fd.get('first')||'').toString().trim();
        var last  = (fd.get('last')||'').toString().trim();
        var email = (fd.get('email')||'').toString().trim().toLowerCase();
        var phone = (fd.get('phone')||'').toString().trim();
        var fullName = (first + ' ' + last).trim();
        var label = selectedType === 'borrower' ? 'Borrower' : 'Investor';
        var section = selectedType === 'borrower' ? 'Borrowers' : 'LPs / Investors';

        submitBtn.disabled = true;
        var origLabel = submitBtn.textContent;
        submitBtn.textContent = 'Creating…';

        var tempPw = makeTempPassword();

        // 1. Create the auth user + profile via the admin RPC (role=client,
        //    status=active so they can sign in immediately).
        var rpcRes = await OnixDB.client.rpc('admin_create_client', {
          p_email:     email,
          p_password:  tempPw,
          p_full_name: fullName,
          p_role:      'client',
          p_status:    'active'
        });
        if (rpcRes.error) {
          submitBtn.disabled = false;
          submitBtn.textContent = origLabel;
          window.__onix_showToast('Could not add client: ' + (rpcRes.error.message || 'unknown error'), '#C0392B');
          return;
        }

        // 2. Mark them as a Borrower or LP so the Clients page splits put
        //    them in the right section automatically.
        var flagUpdate = selectedType === 'borrower'
          ? { is_borrower: true,  is_lp: false, phone: phone || null }
          : { is_borrower: false, is_lp: true,  phone: phone || null };
        var upd = await OnixDB.client.from('profiles').update(flagUpdate).eq('email', email);
        if (upd && upd.error) {
          console.error('[onix-newclient] flag update failed:', upd.error);
          window.__onix_showToast('Account created but role flag failed to set: ' + upd.error.message, '#B8651A');
        }

        submitBtn.disabled = false;
        submitBtn.textContent = origLabel;
        close();

        // 3. Sticky toast with temp password — admin needs time to copy it.
        window.__onix_showToast(
          '<b>' + esc(fullName) + '</b> added as ' + label + ' → ' + section + ' section.<br>' +
          'Share this temporary password so they can sign in:<br>' +
          '<span style="font-family:monospace;font-size:.9rem;background:#fff;color:#C0392B;padding:2px 8px;border-radius:2px;display:inline-block;margin-top:6px;user-select:all">' + esc(tempPw) + '</span>' +
          '<div style="font-size:.7rem;color:#bbb;margin-top:8px;font-style:italic">Click the password to select it. Close this when you have it copied.</div>',
          '#3B8B3B',
          { sticky: true }
        );

        // 4. Trigger a clients refresh so the new row appears in the right section.
        document.querySelectorAll('[data-clients-section]').forEach(function(s){ s.remove(); });
        var mainTable = document.querySelector('#view-clients table.tbl[data-sections-built="1"]');
        if (mainTable) mainTable.removeAttribute('data-sections-built');
        if (typeof window.__onixAdminRefresh === 'function') window.__onixAdminRefresh();
        // The MutationObserver in splitClientsBySection re-splits when the
        // freshly-painted table replaces the old one.
      });

      // Click delegation — catches the trigger whether it's a <button> or
      // an <a> (the in-view "+ New Client" rendered by paintClientsView is
      // actually an <a>). Capture-phase + stopImmediatePropagation so the
      // old form-based modal in admin-portal-data.js doesn't also open.
      document.addEventListener('click', function(e){
        var t = e.target;
        var btn = t && t.closest && t.closest('button, a');
        if (!btn) return;
        if (!/\+\s*(New|Nuevo)\s*(Client|Cliente)/i.test(btn.textContent || '')) return;
        e.preventDefault();
        e.stopImmediatePropagation();
        m.classList.add('show');
        setTimeout(function(){ var fi = m.querySelector('input[name="first"]'); if (fi) fi.focus(); }, 80);
      }, true);
    }

    setTimeout(inject, 1300);
  });

  /* Clients table — formerly split the "Role" column into Borrower / LP
     checkbox columns. Superseded by the Borrowers / LPs section split
     below. We keep this IIFE around but turn splitRoleColumn into a no-op
     so the columns are no longer injected. The CSS class definitions are
     also harmless if never matched. */
  window.addEventListener('load', function(){
    var ROLE_STYLES_ID = '__onix_role_styles';
    if (!document.getElementById(ROLE_STYLES_ID)) {
      var rs = document.createElement('style');
      rs.id = ROLE_STYLES_ID;
      rs.textContent = [
        '.role-cell{text-align:center;width:88px}',
        '.role-chk{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:1.5px solid #E0DAD3;border-radius:3px;background:#fff;transition:all .15s;vertical-align:middle}',
        '.role-chk.on.borrower{border-color:#C0392B;background:#C0392B;color:#fff}',
        '.role-chk.on.lp{border-color:#1A1A1A;background:#1A1A1A;color:#fff}',
        '.role-chk svg{display:block}',
        '.role-chk.off svg{display:none}',
        '.role-col-borrower{background:rgba(192,57,43,.025)}',
        '.role-col-lp{background:rgba(26,26,26,.025)}',
        'th.role-col-borrower,th.role-col-lp{font-size:.6rem !important;letter-spacing:.14em !important;text-align:center !important;border-bottom:2px solid transparent !important}',
        'th.role-col-borrower{border-bottom-color:#C0392B !important;color:#1A1A1A !important}',
        'th.role-col-lp{border-bottom-color:#1A1A1A !important;color:#1A1A1A !important}'
      ].join('\n');
      document.head.appendChild(rs);
    }

    var CHECK_SVG = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';

    function splitRoleColumn() {
      // No-op: the clients table is now split into Borrowers / LPs as
      // separate sections (see splitClientsBySection below).
      return;
      // The dead code below is left intentionally unreached for reference.
      var view = document.getElementById('view-clients');
      if (!view) return;
      // Only act on the active view; otherwise skip
      if (!view.classList.contains('active')) return;
      var tables = view.querySelectorAll('table');
      tables.forEach(function(t){
        if (t.dataset.roleSplit === '1') return;
        var headers = t.querySelectorAll('thead th');
        if (!headers.length) return;
        var roleIdx = -1;
        headers.forEach(function(h, i){ if (/^role$/i.test(h.textContent.trim())) roleIdx = i; });
        if (roleIdx < 0) return;

        // Replace the single Role <th> with two
        var origTh = headers[roleIdx];
        var thB = document.createElement('th');
        thB.className = 'role-col-borrower';
        thB.textContent = 'Borrower';
        var thL = document.createElement('th');
        thL.className = 'role-col-lp';
        thL.textContent = 'LP';
        origTh.replaceWith(thB);
        thB.after(thL);

        // Update each body row
        t.querySelectorAll('tbody tr').forEach(function(tr){
          var cells = tr.children;
          if (!cells[roleIdx]) return;
          var raw = (cells[roleIdx].textContent || '').toLowerCase();
          var hasB = /borrower/.test(raw);
          var hasL = /\blp\b|investor|lender/.test(raw);

          var origTd = cells[roleIdx];
          var tdB = document.createElement('td');
          tdB.className = 'role-cell role-col-borrower';
          tdB.innerHTML = '<span class="role-chk borrower ' + (hasB ? 'on' : 'off') + '" aria-label="Borrower ' + (hasB ? 'yes' : 'no') + '" style="cursor:pointer" title="Click to toggle Borrower role">' + CHECK_SVG + '</span>';
          tdB.querySelector('.role-chk').addEventListener('click', function() {
            this.classList.toggle('on');
            this.classList.toggle('off');
            var on = this.classList.contains('on');
            this.setAttribute('aria-label', 'Borrower ' + (on ? 'yes' : 'no'));
            var pid = tr.dataset.profileId;
            if (pid && window.OnixDB) {
              OnixDB.client.from('profiles').update({ is_borrower: on }).eq('id', pid)
                .then(function(r){ if (r && r.error) console.error('[onix-clients] is_borrower update failed:', r.error); });
            }
          });
          var tdL = document.createElement('td');
          tdL.className = 'role-cell role-col-lp';
          tdL.innerHTML = '<span class="role-chk lp ' + (hasL ? 'on' : 'off') + '" aria-label="LP ' + (hasL ? 'yes' : 'no') + '" style="cursor:pointer" title="Click to toggle LP role">' + CHECK_SVG + '</span>';
          tdL.querySelector('.role-chk').addEventListener('click', function() {
            this.classList.toggle('on');
            this.classList.toggle('off');
            var on = this.classList.contains('on');
            this.setAttribute('aria-label', 'LP ' + (on ? 'yes' : 'no'));
            var pid = tr.dataset.profileId;
            if (pid && window.OnixDB) {
              OnixDB.client.from('profiles').update({ is_lp: on }).eq('id', pid)
                .then(function(r){ if (r && r.error) console.error('[onix-clients] is_lp update failed:', r.error); });
            }
          });
          origTd.replaceWith(tdB);
          tdB.after(tdL);
        });

        t.dataset.roleSplit = '1';
      });
    }

    // Watch for view changes (the bundle toggles .view.active on click).
    // Run once on load and on any DOM mutation under the main column.
    var mo = new MutationObserver(function(){ splitRoleColumn(); });
    setTimeout(function(){
      splitRoleColumn();
      var root = document.querySelector('.main') || document.body;
      mo.observe(root, {subtree:true, childList:true, attributes:true, attributeFilter:['class']});
    }, 1400);
  });

  /* Clients view: split the single combined table into two stacked sections
     — Borrowers (clients with any loans, plus new/unclassified clients) and
     LPs / Investors (clients with any investments). Overlap is allowed: a
     client with both loans and investments shows in both sections.
     Drops the "Role" column entirely (was being split into checkbox columns).
     Re-runs whenever paintClientsView repaints the view. */
  window.addEventListener('load', function(){
    function findMainClientsTable(view){
      var tables = view.querySelectorAll('table');
      for (var i = 0; i < tables.length; i++) {
        var head = tables[i].querySelector('thead');
        if (!head) continue;
        var txt = head.textContent || '';
        if (/Loans/i.test(txt) && /Investments/i.test(txt)) return tables[i];
      }
      return null;
    }
    function colIndex(headers, name){
      for (var i = 0; i < headers.length; i++) {
        if (new RegExp('^' + name + '$', 'i').test(headers[i].textContent.trim())) return i;
      }
      return -1;
    }
    function countFromCell(td){
      if (!td) return 0;
      var t = (td.textContent || '').trim();
      var n = parseInt(t, 10);
      return isNaN(n) ? 0 : n;
    }
    function sectionWrap(title, subtitle, table){
      var wrap = document.createElement('div');
      wrap.setAttribute('data-clients-section', title);
      wrap.style.cssText = 'margin-bottom:32px';
      var hd = document.createElement('div');
      hd.style.cssText = 'margin-bottom:14px';
      hd.innerHTML =
        '<div style="font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:#1A1A1A;font-weight:700">' + title + '</div>' +
        '<div style="font-size:.82rem;color:#888;margin-top:3px">' + subtitle + '</div>';
      wrap.appendChild(hd);
      wrap.appendChild(table);
      return wrap;
    }

    function splitClientsBySection(){
      var view = document.getElementById('view-clients');
      if (!view) return;
      if (!view.classList.contains('active')) return;

      var mainTable = findMainClientsTable(view);
      if (!mainTable) return;
      // Bail if it's already our split layout (avoid infinite loop with the observer)
      if (mainTable.dataset.sectionsBuilt === '1' || mainTable.closest('[data-clients-section]')) return;

      var headers = [].slice.call(mainTable.querySelectorAll('thead th'));
      var roleIdx = colIndex(headers, 'role');
      var loansIdx = colIndex(headers, 'loans');
      var invIdx   = colIndex(headers, 'investments');

      function cloneHeader(){
        var thead = mainTable.querySelector('thead').cloneNode(true);
        if (roleIdx >= 0) {
          var ths = thead.querySelectorAll('th');
          if (ths[roleIdx]) ths[roleIdx].remove();
        }
        return thead;
      }
      function makeTableShell(){
        var t = document.createElement('table');
        // Copy classes/styling from the original so it looks consistent
        if (mainTable.className) t.className = mainTable.className;
        if (mainTable.getAttribute('style')) t.setAttribute('style', mainTable.getAttribute('style'));
        t.appendChild(cloneHeader());
        t.appendChild(document.createElement('tbody'));
        return t;
      }
      function rowFor(tr){
        var clone = tr.cloneNode(true);
        if (roleIdx >= 0) {
          var cells = clone.children;
          if (cells[roleIdx]) cells[roleIdx].remove();
        }
        return clone;
      }
      function emptyRow(cols, msg){
        var tr = document.createElement('tr');
        var td = document.createElement('td');
        td.colSpan = cols;
        td.style.cssText = 'padding:18px;color:#888;font-style:italic;text-align:center';
        td.textContent = msg;
        tr.appendChild(td);
        return tr;
      }

      var bTable = makeTableShell();
      var lTable = makeTableShell();
      var bTbody = bTable.querySelector('tbody');
      var lTbody = lTable.querySelector('tbody');

      var rows = [].slice.call(mainTable.querySelectorAll('tbody tr'));
      // Only operate on real client rows (skip the "No clients yet." colspan row)
      var realRows = rows.filter(function(r){ return r.querySelector('[data-cl-view]') || r.dataset.profileId; });

      realRows.forEach(function(tr){
        var loans = loansIdx >= 0 ? countFromCell(tr.children[loansIdx]) : 0;
        var invs  = invIdx   >= 0 ? countFromCell(tr.children[invIdx])   : 0;
        // paintClientsView writes the Role cell as "Borrower" / "LP" /
        // "Borrower + LP" / "—" based on profiles.is_borrower and is_lp,
        // so we can read it directly to honor admin's explicit choice.
        var roleText = roleIdx >= 0 && tr.children[roleIdx] ? (tr.children[roleIdx].textContent || '') : '';
        var hasB = /borrower/i.test(roleText);
        var hasL = /\blp\b|investor|lender/i.test(roleText);
        var inBorrowers = hasB || loans > 0;
        var inLps       = hasL || invs  > 0;
        // Completely unclassified (no flag, no activity) → default to Borrowers
        if (!inBorrowers && !inLps) inBorrowers = true;
        if (inBorrowers) bTbody.appendChild(rowFor(tr));
        if (inLps)       lTbody.appendChild(rowFor(tr));
      });

      var colCount = headers.length - (roleIdx >= 0 ? 1 : 0);
      if (!bTbody.children.length) bTbody.appendChild(emptyRow(colCount, 'No borrowers yet.'));
      if (!lTbody.children.length) lTbody.appendChild(emptyRow(colCount, 'No LPs / investors yet.'));

      var bSection = sectionWrap('Borrowers',       'Clients receiving loan capital',     bTable);
      var lSection = sectionWrap('LPs / Investors', 'Capital providers (LPs)',            lTable);

      mainTable.dataset.sectionsBuilt = '1';
      var parent = mainTable.parentElement;
      parent.insertBefore(bSection, mainTable);
      parent.insertBefore(lSection, mainTable);
      mainTable.style.display = 'none';
    }

    // Initial run + watch for paintClientsView re-rendering the view.
    var mo = new MutationObserver(function(muts){
      // If the view's innerHTML was replaced (paintClientsView re-paint),
      // our injected sections + the data-sectionsBuilt marker are gone.
      // Re-run if we no longer see our section markers.
      var view = document.getElementById('view-clients');
      if (!view || !view.classList.contains('active')) return;
      if (view.querySelector('[data-clients-section]')) return;
      splitClientsBySection();
    });
    setTimeout(function(){
      splitClientsBySection();
      var root = document.querySelector('.main') || document.body;
      mo.observe(root, { subtree: true, childList: true, attributes: true, attributeFilter: ['class'] });
    }, 1600);
  });

  /* Client profile modal — intercept the row's "View" button on the Clients
     table and open a categorized document profile (lender vs borrower).
     Files are kept in localStorage as metadata + an in-session blob URL
     created on upload, so Download works for the current session. */
  window.addEventListener('load', function(){
    var TYPE_MAP = {
      'carlos mendoza': 'borrower',
      'diana ortiz': 'lender',
      'javier torres': 'borrower',
      'silva group llc': 'borrower',
      'robert chen': 'lender'
    };

    function clientType(name) {
      var k = (name || '').trim().toLowerCase();
      // Strip leading initials like "CMCarlos Mendoza" -> "Carlos Mendoza"
      k = k.replace(/^[a-z]{2}(?=[a-z])/, '');
      return TYPE_MAP[k] || 'borrower';
    }

    function loadStore() {
      try { return JSON.parse(localStorage.getItem('onix-client-docs') || '{}'); } catch(_){ return {}; }
    }
    function saveStore(s) { localStorage.setItem('onix-client-docs', JSON.stringify(s)); }

    function emptyDocs(type) {
      var d = { kyc: { id: [], proofOfAddress: [] } };
      if (type === 'lender') d.promissoryNotes = [];
      else d.loanDocs = [];
      return d;
    }

    function fmtSize(b) {
      if (b == null) return '';
      if (b < 1024) return b + ' B';
      if (b < 1024*1024) return (b/1024).toFixed(1) + ' KB';
      return (b/(1024*1024)).toFixed(1) + ' MB';
    }
    function fmtDate(iso) {
      try { return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
      catch(_) { return iso; }
    }

    // Seed a few demo files so empty/non-empty states are both visible.
    function seed(store) {
      // One-time cleanup: remove stale "Promissory Note" entries from borrower
      // loanDocs (they belong on lender Promissory Notes section only).
      if (!store.__cleanedPromissoryFromLoanDocs) {
        Object.keys(store).forEach(function(k){
          if (k.indexOf('__') === 0) return;
          var c = store[k];
          if (c && c.type === 'borrower' && c.docs && Array.isArray(c.docs.loanDocs)) {
            c.docs.loanDocs = c.docs.loanDocs.filter(function(f){
              return !/promissory\s*note/i.test(f.name || '');
            });
          }
        });
        store.__cleanedPromissoryFromLoanDocs = true;
        saveStore(store);
      }
      if (store.__seeded) return store;
      var iso = function(d){ return new Date(d).toISOString(); };
      var f = function(n,k,d){ return {name:n,size:k*1024,uploadedAt:iso(d),id:'f-'+Math.random().toString(36).slice(2,8)}; };
      store['Carlos Mendoza'] = { type:'borrower', docs: {
        loanDocs: [f('Deed of Trust.pdf', 1800, '2024-11-01'), f('Loan Agreement.pdf', 920, '2024-11-01'), f('Closing Disclosure.pdf', 480, '2024-11-01')],
        kyc: { id: [f('Drivers License.jpg', 540, '2024-10-22')], proofOfAddress: [f('Reliant Energy — Oct 2024.pdf', 220, '2024-10-22')] }
      }};
      store['Diana Ortiz'] = { type:'lender', docs: {
        promissoryNotes: [f('Promissory Note — La Grange.pdf', 1100, '2024-10-03'), f('Promissory Note — Bari Caffè.pdf', 980, '2024-08-12')],
        kyc: { id: [f('Passport.pdf', 1200, '2020-06-14')], proofOfAddress: [] }
      }};
      store['Javier Torres'] = { type:'borrower', docs: {
        loanDocs: [f('Loan Agreement — ONX-2024-0046.pdf', 2200, '2024-09-15')],
        kyc: { id: [], proofOfAddress: [] }
      }};
      store['Silva Group LLC'] = { type:'borrower', docs: emptyDocs('borrower') };
      store['Robert Chen'] = { type:'lender', docs: emptyDocs('lender') };
      store.__seeded = true;
      saveStore(store);
      return store;
    }

    function getClient(name) {
      var store = seed(loadStore());
      if (!store[name]) {
        var type = clientType(name);
        store[name] = { type: type, docs: emptyDocs(type) };
        saveStore(store);
      }
      return store[name];
    }
    function setClient(name, c) {
      var store = loadStore();
      store[name] = c;
      saveStore(store);
    }

    // Build the modal once.
    function buildModal() {
      if (document.getElementById('__onix_profile')) return;

      var s = document.createElement('style');
      s.textContent = [
        '#__onix_profile{position:fixed;inset:0;z-index:99997;display:none;align-items:flex-start;justify-content:center;background:rgba(20,20,20,.55);backdrop-filter:blur(3px);overflow:auto;padding:40px 20px;font-family:"DM Sans",-apple-system,sans-serif;color:#1A1A1A}',
        '#__onix_profile.show{display:flex}',
        '#__onix_profile .pp-card{background:#F8F7F5;width:760px;max-width:100%;border-top:3px solid #C0392B;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:__onix_pop .22s cubic-bezier(.2,.8,.2,1)}',
        '#__onix_profile .pp-hd{padding:28px 36px 22px;background:#fff;border-bottom:1px solid #E8E8E8;display:flex;align-items:center;justify-content:space-between;gap:20px}',
        '#__onix_profile .pp-hd h2{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;font-size:1.85rem;line-height:1.05;letter-spacing:-.005em}',
        '#__onix_profile .pp-hd .pp-eyebrow{font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:#C0392B;font-weight:600;margin-bottom:6px}',
        '#__onix_profile .pp-type{display:inline-block;padding:3px 10px;border-radius:2px;font-size:.62rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-top:8px}',
        '#__onix_profile .pp-type.lender{background:#1A1A1A;color:#fff}',
        '#__onix_profile .pp-type.borrower{background:#C0392B;color:#fff}',
        '#__onix_profile .pp-close{background:none;border:none;cursor:pointer;color:#888;font-size:24px;padding:4px 8px;line-height:1}',
        '#__onix_profile .pp-close:hover{color:#C0392B}',
        '#__onix_profile .pp-body{padding:24px 36px 36px;display:flex;flex-direction:column;gap:20px}',
        '#__onix_profile .pp-section{background:#fff;border:1px solid #E8E8E8;border-top:3px solid #C0392B}',
        '#__onix_profile .pp-sec-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px 14px}',
        '#__onix_profile .pp-sec-hd h3{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:#1A1A1A;font-weight:700}',
        '#__onix_profile .pp-sec-hd .pp-count{font-size:.62rem;letter-spacing:.1em;color:#9B9590;font-weight:600;margin-left:6px}',
        '#__onix_profile .pp-upload{padding:7px 14px;font-size:.66rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:#1A1A1A;color:#fff;border:none;border-radius:2px;cursor:pointer;transition:background .15s}',
        '#__onix_profile .pp-upload:hover{background:#C0392B}',
        '#__onix_profile .pp-files{padding:0 22px 18px;display:flex;flex-direction:column;gap:6px}',
        '#__onix_profile .pp-file{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;background:#F8F7F5;border-left:3px solid #C0392B}',
        '#__onix_profile .pp-file-info{flex:1;min-width:0}',
        '#__onix_profile .pp-file-name{font-size:.84rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}',
        '#__onix_profile .pp-file-meta{font-size:.7rem;color:#9B9590;margin-top:2px}',
        '#__onix_profile .pp-file-actions{display:flex;gap:6px;flex-shrink:0}',
        '#__onix_profile .pp-file-actions button{padding:6px 10px;font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-radius:2px;cursor:pointer;border:1px solid transparent;font-family:inherit;transition:all .15s}',
        '#__onix_profile .pp-dl{background:transparent;color:#888;border-color:#E8E8E8}',
        '#__onix_profile .pp-dl:hover{border-color:#1A1A1A;color:#1A1A1A}',
        '#__onix_profile .pp-del{background:transparent;color:#9B9590;border-color:#E8E8E8}',
        '#__onix_profile .pp-del:hover{border-color:#C0392B;color:#C0392B}',
        '#__onix_profile .pp-empty{padding:18px 22px 22px;color:#9B9590;font-size:.82rem;font-style:italic;text-align:center}',
        '#__onix_profile .pp-subgroup{padding:0 22px 4px}',
        '#__onix_profile .pp-sub-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0 8px;border-top:1px solid #f0f0f0;margin-top:8px}',
        '#__onix_profile .pp-subgroup:first-child .pp-sub-hd{border-top:none;margin-top:0}',
        '#__onix_profile .pp-sub-hd h4{font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:#6B6560;font-weight:700}',
        '#__onix_profile .pp-sub-upload{padding:5px 11px;font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:transparent;color:#C0392B;border:1px solid #C0392B;border-radius:2px;cursor:pointer;transition:all .15s}',
        '#__onix_profile .pp-sub-upload:hover{background:#C0392B;color:#fff}'
      ].join('\n');
      document.head.appendChild(s);

      var modal = document.createElement('div');
      modal.id = '__onix_profile';
      modal.innerHTML = '<div class="pp-card"><div class="pp-hd"></div><div class="pp-body"></div></div>';
      document.body.appendChild(modal);
      modal.addEventListener('click', function(e){ if (e.target === modal) close(); });
      document.addEventListener('keydown', function(e){
        if (e.key === 'Escape' && modal.classList.contains('show')) close();
      });
    }

    var current = null; // { name, client }

    function close() {
      var modal = document.getElementById('__onix_profile');
      if (modal) modal.classList.remove('show');
      current = null;
    }

    function pickFile(accept, cb) {
      var inp = document.createElement('input');
      inp.type = 'file'; inp.accept = accept || '*/*'; inp.multiple = true;
      inp.addEventListener('change', function(){
        var files = [].slice.call(inp.files || []);
        if (!files.length) return;
        cb(files);
      });
      inp.click();
    }

    var blobUrls = {}; // id -> objectURL (session-only)

    function addFiles(category, sub, files) {
      if (!current) return;
      var arr = sub
        ? current.client.docs[category][sub]
        : current.client.docs[category];
      files.forEach(function(f){
        var meta = {
          name: f.name,
          size: f.size,
          uploadedAt: new Date().toISOString(),
          id: 'f-' + Math.random().toString(36).slice(2,10)
        };
        try { blobUrls[meta.id] = URL.createObjectURL(f); } catch(_){}
        arr.push(meta);
      });
      setClient(current.name, current.client);
      render();
    }

    function deleteFile(category, sub, id) {
      if (!current) return;
      var arr = sub
        ? current.client.docs[category][sub]
        : current.client.docs[category];
      var i = arr.findIndex(function(x){ return x.id === id; });
      if (i >= 0) {
        if (blobUrls[id]) { try { URL.revokeObjectURL(blobUrls[id]); } catch(_){} delete blobUrls[id]; }
        arr.splice(i, 1);
        setClient(current.name, current.client);
        render();
      }
    }

    function downloadFile(meta) {
      var url = blobUrls[meta.id];
      if (!url) {
        alert('This file was uploaded in a previous session and the binary was not retained. Re-upload to enable download.');
        return;
      }
      var a = document.createElement('a');
      a.href = url; a.download = meta.name;
      document.body.appendChild(a); a.click(); a.remove();
    }

    function fileRow(meta, onDownload, onDelete) {
      var row = document.createElement('div');
      row.className = 'pp-file';
      row.innerHTML =
        '<div class="pp-file-info">' +
          '<div class="pp-file-name"></div>' +
          '<div class="pp-file-meta"></div>' +
        '</div>' +
        '<div class="pp-file-actions">' +
          '<button class="pp-dl" type="button">Download ↓</button>' +
          '<button class="pp-del" type="button">Delete</button>' +
        '</div>';
      row.querySelector('.pp-file-name').textContent = meta.name;
      row.querySelector('.pp-file-meta').textContent = fmtDate(meta.uploadedAt) + ' · ' + fmtSize(meta.size);
      row.querySelector('.pp-dl').addEventListener('click', onDownload);
      row.querySelector('.pp-del').addEventListener('click', onDelete);
      return row;
    }

    function buildSection(opts) {
      // opts: { title, accept, category, sub?, files, emptyMsg }
      var sec = document.createElement('div');
      sec.className = 'pp-section';
      var hd = document.createElement('div');
      hd.className = 'pp-sec-hd';
      hd.innerHTML = '<h3>' + opts.title + ' <span class="pp-count">(' + opts.files.length + ')</span></h3>';
      var up = document.createElement('button');
      up.className = 'pp-upload';
      up.type = 'button';
      up.textContent = '+ Upload';
      up.addEventListener('click', function(){
        pickFile(opts.accept, function(files){ addFiles(opts.category, opts.sub, files); });
      });
      hd.appendChild(up);
      sec.appendChild(hd);

      var list = document.createElement('div');
      list.className = 'pp-files';
      if (!opts.files.length) {
        var em = document.createElement('div');
        em.className = 'pp-empty';
        em.textContent = opts.emptyMsg;
        sec.appendChild(em);
      } else {
        opts.files.forEach(function(meta){
          list.appendChild(fileRow(
            meta,
            function(){ downloadFile(meta); },
            function(){ deleteFile(opts.category, opts.sub, meta.id); }
          ));
        });
        sec.appendChild(list);
      }
      return sec;
    }

    function buildKycSection(client) {
      var sec = document.createElement('div');
      sec.className = 'pp-section';
      var totalCount = (client.docs.kyc.id.length + client.docs.kyc.proofOfAddress.length);
      sec.innerHTML = '<div class="pp-sec-hd"><h3>KYC Documents <span class="pp-count">(' + totalCount + ')</span></h3></div>';

      [
        {sub:'id', title:'ID', accept:'image/*,application/pdf', empty:'No ID documents uploaded yet.'},
        {sub:'proofOfAddress', title:'Proof of Address', accept:'image/*,application/pdf', empty:'No proof-of-address documents uploaded yet.'}
      ].forEach(function(g){
        var grp = document.createElement('div');
        grp.className = 'pp-subgroup';
        var hd = document.createElement('div');
        hd.className = 'pp-sub-hd';
        hd.innerHTML = '<h4>' + g.title + ' · ' + client.docs.kyc[g.sub].length + '</h4>';
        var up = document.createElement('button');
        up.className = 'pp-sub-upload';
        up.type = 'button';
        up.textContent = '+ Upload';
        up.addEventListener('click', function(){
          pickFile(g.accept, function(files){ addFiles('kyc', g.sub, files); });
        });
        hd.appendChild(up);
        grp.appendChild(hd);

        var files = client.docs.kyc[g.sub];
        if (!files.length) {
          var em = document.createElement('div');
          em.className = 'pp-empty';
          em.style.padding = '12px 0 14px';
          em.style.textAlign = 'left';
          em.textContent = g.empty;
          grp.appendChild(em);
        } else {
          var list = document.createElement('div');
          list.style.cssText = 'display:flex;flex-direction:column;gap:6px;padding:4px 0 12px';
          files.forEach(function(meta){
            list.appendChild(fileRow(
              meta,
              function(){ downloadFile(meta); },
              function(){ deleteFile('kyc', g.sub, meta.id); }
            ));
          });
          grp.appendChild(list);
        }
        sec.appendChild(grp);
      });
      return sec;
    }

    function render() {
      var modal = document.getElementById('__onix_profile');
      var hd = modal.querySelector('.pp-hd');
      var body = modal.querySelector('.pp-body');
      hd.innerHTML = '';
      body.innerHTML = '';
      if (!current) return;
      var c = current.client;
      var typeLabel = c.type.charAt(0).toUpperCase() + c.type.slice(1);

      var hLeft = document.createElement('div');
      hLeft.innerHTML =
        '<div class="pp-eyebrow">Client Profile</div>' +
        '<h2></h2>' +
        '<div><span class="pp-type ' + c.type + '">' + typeLabel + '</span></div>';
      hLeft.querySelector('h2').textContent = current.name;

      var closeBtn = document.createElement('button');
      closeBtn.className = 'pp-close';
      closeBtn.type = 'button';
      closeBtn.setAttribute('aria-label','Close');
      closeBtn.textContent = '×';
      closeBtn.addEventListener('click', close);

      hd.appendChild(hLeft);
      hd.appendChild(closeBtn);

      if (c.type === 'lender') {
        body.appendChild(buildSection({
          title: 'Promissory Notes',
          accept: 'application/pdf',
          category: 'promissoryNotes',
          files: c.docs.promissoryNotes,
          emptyMsg: 'No promissory notes uploaded yet.'
        }));
      } else {
        body.appendChild(buildSection({
          title: 'Loan Documents',
          accept: 'application/pdf',
          category: 'loanDocs',
          files: c.docs.loanDocs,
          emptyMsg: 'No loan documents uploaded yet.'
        }));
      }
      body.appendChild(buildKycSection(c));
    }

    function open(name) {
      buildModal();
      var client = getClient(name);
      // Backfill if seed didn't include this person (e.g. newly added)
      if (!client.type) client.type = clientType(name);
      if (!client.docs) client.docs = emptyDocs(client.type);
      current = { name: name, client: client };
      render();
      var modal = document.getElementById('__onix_profile');
      modal.classList.add('show');
      modal.scrollTop = 0;
    }

    // Disabled — replaced by Supabase-backed View + Documents buttons below.
    // (Old localStorage profile modal kept as dead code for reference.)
  });

  /* =====================================================================
     CLIENTS TAB — Supabase-backed:
       • renders the table from public.profiles (clients only)
       • Borrower / LP toggles persist via splitRoleColumn handlers above
       • per-row View button reuses the LP Profile modal from Investors
       • per-row Documents button opens a new modal listing
         public.client_documents for that profile
     ===================================================================== */
  window.addEventListener('load', function(){
    if (!window.OnixDB) return;

    function fmtMoney(n){ return n == null ? '—' : '$' + Number(n).toLocaleString('en-US',{maximumFractionDigits:0}); }
    function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'})[c];
    }); }
    // Client names render in ALL CAPS throughout the admin portal (display
    // only — never touches profiles.full_name itself).
    function up(s){ return s ? String(s).toUpperCase() : s; }
    function initials(name){
      var parts = String(name || '').trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return '—';
      var f = parts[0][0] || '';
      var l = parts.length > 1 ? parts[parts.length-1][0] : '';
      return (f + l).toUpperCase();
    }
    function roleText(p){
      var b = !!p.is_borrower, l = !!p.is_lp;
      if (b && l) return 'Borrower + LP';
      if (b) return 'Borrower';
      if (l) return 'LP';
      return '—';
    }
    function yearOf(iso){ try { return new Date(iso).getFullYear(); } catch(_) { return '—'; } }

    async function loadClientsAndPaint(){
      var view = document.getElementById('view-clients');
      if (!view) return;
      var table = view.querySelector('table.tbl');
      if (!table) return;
      var tbody = table.querySelector('tbody');
      if (!tbody) return;

      // Fetch clients + their loan/investment counts in parallel
      var c = OnixDB.client;
      var pRes = await c.from('profiles').select('*').eq('role','client').order('created_at',{ascending:false});
      if (pRes.error) { console.error('[onix-clients] profiles load failed:', pRes.error); return; }
      var clients = pRes.data || [];
      var ids = clients.map(function(p){ return p.id; });
      var loanCounts = {}, invCounts = {};
      if (ids.length){
        var [lRes, iRes] = await Promise.all([
          c.from('loans').select('user_id, data_source').in('user_id', ids),
          c.from('investments').select('user_id').in('user_id', ids)
        ]);
        // OUS-synced rows (data_source: 'ous_pasiva') are deposits, not loans —
        // fold them into the Investments count instead so a depositor still
        // shows an active position here (see paintClientsView in
        // admin-portal-data.js, which fixes the same mislabeling).
        (lRes.data || []).forEach(function(r){
          if (r.data_source === 'ous_pasiva') invCounts[r.user_id] = (invCounts[r.user_id] || 0) + 1;
          else loanCounts[r.user_id] = (loanCounts[r.user_id] || 0) + 1;
        });
        (iRes.data || []).forEach(function(r){ invCounts[r.user_id] = (invCounts[r.user_id] || 0) + 1; });
      }

      // Reset thead back to the bundler's original 8 columns if splitRoleColumn
      // already split it. Otherwise splitRoleColumn won't find a "Role" header
      // and won't process our freshly-painted rows.
      var thead = table.querySelector('thead');
      if (thead) {
        var bTh = thead.querySelector('th.role-col-borrower');
        var lTh = thead.querySelector('th.role-col-lp');
        if (bTh && lTh) {
          var roleTh = document.createElement('th');
          roleTh.setAttribute('data-en', 'Role');
          roleTh.setAttribute('data-es', 'Rol');
          roleTh.textContent = 'Role';
          bTh.replaceWith(roleTh);
          lTh.remove();
        }
      }

      // Repaint tbody with the bundler's 8 columns:
      // Client | Role | Loans | Investments | Lang | RM | Since | actions
      tbody.innerHTML = '';
      clients.forEach(function(p){
        var name = up(p.full_name) || p.email || 'Client';
        var tr = document.createElement('tr');
        tr.dataset.profileId = p.id;
        tr.innerHTML =
          '<td><span class="mini-avatar">' + esc(initials(name)) + '</span>' + esc(name) + '</td>' +
          '<td>' + esc(roleText(p)) + '</td>' +
          '<td>' + (loanCounts[p.id] || '—') + '</td>' +
          '<td>' + (invCounts[p.id] || '—') + '</td>' +
          '<td>—</td>' +
          '<td>—</td>' +
          '<td>' + yearOf(p.created_at) + '</td>' +
          '<td class="tbl-actions">' +
            '<button class="tbl-btn" data-cl-view="1">View</button> ' +
            '<button class="tbl-btn" data-cl-docs="1">Documents</button>' +
          '</td>';
        tbody.appendChild(tr);
      });

      // Let splitRoleColumn re-process: it'll split the restored Role
      // header into Borrower + LP and wire the (now-persistent) chk handlers.
      table.dataset.roleSplit = '';
    }

    // Inject the "Import from OUS" button bar at the top of the Clients
    // view. Idempotent — runs every paint, only adds the bar once.
    // Calls the import-ous-clients Supabase edge function (admin-only),
    // streams progress into a result modal, then re-paints the table.
    function ensureImportFromOusButton(){
      var view = document.getElementById('view-clients');
      if (!view) return;
      if (view.querySelector('[data-onix-ous-import]')) return;

      var host = document.createElement('div');
      host.setAttribute('data-onix-ous-import', '1');
      host.style.cssText =
        'display:flex;align-items:center;gap:12px;margin:0 0 18px;padding:12px 16px;' +
        'background:#fff;border:1px solid #E8E8E8;border-left:3px solid #C0392B';

      var label = document.createElement('div');
      label.style.cssText = 'flex:1;font-size:.78rem;color:#1A1A1A';
      label.innerHTML =
        '<strong>OUS Pasiva sync</strong> · Pulls the latest closing-balances feed and creates/updates client profiles + loans. Idempotent — safe to re-run.';

      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tbl-btn';
      btn.style.cssText =
        'background:#C0392B;color:#fff;border:1px solid #C0392B;padding:9px 16px;' +
        'cursor:pointer;font:600 .72rem/1 "DM Sans",sans-serif;text-transform:uppercase;' +
        'letter-spacing:.1em;border-radius:2px';
      btn.textContent = 'Import from OUS';

      btn.addEventListener('click', async function(){
        if (btn.disabled) return;
        var today = new Date().toISOString().slice(0, 10);
        var fecha = prompt('Closing date to pull from OUS (YYYY-MM-DD):', today);
        if (!fecha || !/^\d{4}-\d{2}-\d{2}$/.test(fecha)) return;
        if (!confirm('Run OUS import for ' + fecha + '?\\n\\nThis creates/updates auth users + profiles + loans for every client in the feed. Safe to re-run.')) return;

        btn.disabled = true;
        var orig = btn.textContent;
        btn.textContent = 'Importing…';
        try {
          var sess = await OnixDB.client.auth.getSession();
          var token = sess && sess.data && sess.data.session && sess.data.session.access_token;
          if (!token) throw new Error('Not logged in.');

          var r = await OnixDB.client.functions.invoke('import-ous-clients', {
            body: { fecha_cierre: fecha }
          });
          if (r.error) throw r.error;
          var d = r.data || {};
          var msg =
            'OUS import for ' + (d.fecha_cierre || fecha) + '\\n\\n' +
            'OUS rows received:   ' + (d.total_ous_rows || 0) + '\\n' +
            'Unique clients:      ' + (d.unique_clients || 0) + '\\n\\n' +
            'Profiles created:    ' + (d.profiles && d.profiles.created || 0) + '\\n' +
            'Profiles existing:   ' + (d.profiles && d.profiles.existing || 0) + '\\n' +
            'Fallback emails:     ' + (d.profiles && d.profiles.fallback_emails || 0) + '\\n' +
            'Profile errors:      ' + (d.profiles && d.profiles.errored || 0) + '\\n\\n' +
            'Loans created:       ' + (d.loans && d.loans.created || 0) + '\\n' +
            'Loans existing:      ' + (d.loans && d.loans.existing || 0) + '\\n' +
            'Loan errors:         ' + (d.loans && d.loans.errored || 0);
          if (d.error_count) msg += '\\n\\nFirst error: ' + (d.errors && d.errors[0] ? JSON.stringify(d.errors[0]) : '?');
          alert(msg);
          // Re-paint the table to reflect any new clients.
          loadClientsAndPaint().catch(function(e){ console.error('[onix-clients] re-paint after import failed:', e); });
        } catch (err) {
          console.error('[onix-ous-import]', err);
          alert('Import failed: ' + (err && err.message ? err.message : String(err)));
        } finally {
          btn.disabled = false;
          btn.textContent = orig;
        }
      });

      host.appendChild(label);
      host.appendChild(btn);

      // Place just above the clients table
      var table = view.querySelector('table.tbl');
      if (table && table.parentElement) {
        table.parentElement.insertBefore(host, table);
      } else {
        view.insertBefore(host, view.firstChild);
      }
    }

    // Poll until view-clients exists in the DOM (the Bolt bundler unpacks
    // the template asynchronously), then paint once. We deliberately do NOT
    // require .active — the bundle may toggle views via inline display
    // styles rather than classes, and we want the table ready by the time
    // the admin actually navigates to it.
    var painted = false;
    function tryPaint(){
      if (painted) return;
      var view = document.getElementById('view-clients');
      if (!view) return;
      var table = view.querySelector('table.tbl');
      if (!table || !table.querySelector('tbody')) return;
      ensureImportFromOusButton();
      painted = true;
      loadClientsAndPaint().catch(function(e){
        console.error('[onix-clients] paint failed:', e);
        painted = false;
      });
    }
    var attempts = 0;
    (function poll(){
      if (painted || attempts++ > 40) return; // ~12s max
      tryPaint();
      setTimeout(poll, 300);
    })();

    // ---------- View button → reuse the Investors LP Profile modal ----------
    function ivCell(label, val, full){
      return '<div class="onix-info-cell' + (full ? ' full' : '') + '">' +
             '<div class="ic-label">' + esc(label) + '</div>' +
             '<div class="ic-val">' + (val == null || val === '' ? '—' : esc(val)) + '</div>' +
             '</div>';
    }

    function fmtNoteDate(iso){
      try { return new Date(iso).toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}); }
      catch(_) { return ''; }
    }
    function notesMetaText(noteRow){
      if (!noteRow || !noteRow.updated_at) return 'No notes yet.';
      var who = (noteRow.updated_by_profile && (noteRow.updated_by_profile.full_name || noteRow.updated_by_profile.email)) || 'an admin';
      return 'Last updated by ' + esc(who) + ' on ' + fmtNoteDate(noteRow.updated_at);
    }

    async function openClientInLPModal(profileId){
      var overlay = document.getElementById('__onix_investor_overlay');
      if (!overlay) return; // built lazily by the Investors block on load
      var c = OnixDB.client;
      var [pRes, lRes, iRes, nRes] = await Promise.all([
        c.from('profiles').select('*').eq('id', profileId).single(),
        c.from('loans').select('loan_id_display, balance, principal_amount, interest_rate, maturity_date, status, data_source').eq('user_id', profileId),
        c.from('investments').select('venture_name, amount_invested, status').eq('user_id', profileId),
        c.from('client_admin_notes').select('notes, updated_at, updated_by, updated_by_profile:profiles!updated_by(full_name, email)').eq('profile_id', profileId).maybeSingle()
      ]);
      if (pRes.error) { console.error('[onix-clients] profile fetch failed:', pRes.error); return; }
      if (nRes.error) console.error('[onix-clients] admin notes fetch failed:', nRes.error);
      var p = pRes.data || {};
      var loans = lRes.data || [];
      var invs  = iRes.data || [];
      var noteRow = nRes.data || null;
      var committed = invs.reduce(function(s, x){ return s + Number(x.amount_invested || 0); }, 0);
      var activeDeals = invs.filter(function(x){ return x.status !== 'exited'; }).length;
      // Borrower-side aggregates. Loan Balance = outstanding principal across
      // all active loans; Principal Disbursed = original amounts granted.
      // OUS-synced rows (data_source: 'ous_pasiva') are deposits, not loans —
      // split them out into their own Active Deposits section instead of
      // counting them as loans (same distinction paintClientsView and the
      // Dashboard already make).
      var notClosed = function(x){ return x.status !== 'paid_off' && x.status !== 'closed'; };
      var activeLoanRows    = loans.filter(function(x){ return notClosed(x) && x.data_source !== 'ous_pasiva'; });
      var activeDepositRows = loans.filter(function(x){ return notClosed(x) && x.data_source === 'ous_pasiva'; });
      var loanBalance        = activeLoanRows.reduce(function(s, x){ return s + Number(x.balance || 0); }, 0);
      var principalDisbursed = activeLoanRows.reduce(function(s, x){ return s + Number(x.principal_amount || x.balance || 0); }, 0);
      var depositBalance     = activeDepositRows.reduce(function(s, x){ return s + Number(x.balance || 0); }, 0);
      var name = up(p.full_name) || p.email || 'Client';
      var statusLabel = (p.status || '—').replace(/^./, function(ch){ return ch.toUpperCase(); });

      document.getElementById('__onix_iv_name').textContent = name;
      document.getElementById('__onix_iv_sub').textContent  = p.email || '';
      document.getElementById('__onix_iv_name').style.display = '';
      var editRowLP = document.getElementById('__onix_iv_name_edit');
      if (editRowLP) editRowLP.style.display = 'none';
      var editBtnLP = document.getElementById('__onix_iv_edit_name');
      if (editBtnLP) {
        editBtnLP.dataset.profileId = profileId;
        editBtnLP.dataset.rawName = p.full_name || '';
        editBtnLP.style.display = '';
      }
      document.getElementById('__onix_iv_body').innerHTML =
        '<div class="onix-info-grid" style="margin-bottom:18px">' +
          ivCell('Email', p.email) +
          ivCell('Role', roleText(p)) +
          ivCell('Status', statusLabel) +
          ivCell('Client Since', yearOf(p.created_at)) +
          ivCell('Active Loans', activeLoanRows.length) +
          ivCell('Active Deposits', activeDepositRows.length) +
          ivCell('Active Investments', activeDeals) +
          ivCell('Loan Balance', fmtMoney(loanBalance)) +
          ivCell('Principal Disbursed', fmtMoney(principalDisbursed)) +
          ivCell('Deposit Balance', fmtMoney(depositBalance)) +
          ivCell('Capital Committed (Investments)', fmtMoney(committed), true) +
        '</div>' +
        (activeLoanRows.length
          ? '<div style="font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:#9B9590;font-weight:700;margin-bottom:10px">Active Loans</div>' +
            '<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:18px">' +
              activeLoanRows.map(function(x){
                var rate = x.interest_rate != null ? ' · ' + Number(x.interest_rate).toFixed(2) + '%' : '';
                var mat  = x.maturity_date ? ' · matures ' + x.maturity_date : '';
                return '<div style="padding:10px 14px;background:#F8F7F5;border-left:3px solid #C0392B;font-size:.84rem;font-weight:600">' +
                  '#' + esc(x.loan_id_display || '—') + ' — ' + fmtMoney(x.balance) + rate + mat +
                '</div>';
              }).join('') +
            '</div>'
          : '') +
        (activeDepositRows.length
          ? '<div style="font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:#9B9590;font-weight:700;margin-bottom:10px">Active Deposits</div>' +
            '<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:18px">' +
              activeDepositRows.map(function(x){
                var rate = x.interest_rate != null ? ' · ' + Number(x.interest_rate).toFixed(2) + '%' : '';
                var mat  = x.maturity_date ? ' · matures ' + x.maturity_date : '';
                return '<div style="padding:10px 14px;background:#F8F7F5;border-left:3px solid #C0392B;font-size:.84rem;font-weight:600">' +
                  '#' + esc(x.loan_id_display || '—') + ' — ' + fmtMoney(x.balance) + rate + mat +
                '</div>';
              }).join('') +
            '</div>'
          : '') +
        (invs.length
          ? '<div style="font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:#9B9590;font-weight:700;margin-bottom:10px">Active Investments</div>' +
            '<div style="display:flex;flex-direction:column;gap:6px">' +
              invs.map(function(x){
                return '<div style="padding:10px 14px;background:#F8F7F5;border-left:3px solid #C0392B;font-size:.84rem;font-weight:600">' +
                  esc(x.venture_name || 'Investment') + ' (' + fmtMoney(x.amount_invested) + ')' +
                '</div>';
              }).join('') +
            '</div>'
          : '') +
        '<div style="font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:#9B9590;font-weight:700;margin-bottom:10px;margin-top:18px">Admin Notes</div>' +
        '<textarea id="__onix_iv_notes" rows="4" placeholder="Internal notes about this client — not visible to them" style="width:100%;padding:10px 12px;border:1px solid #E8E8E8;border-radius:2px;font-size:.85rem;font-family:inherit;outline:none;resize:vertical;box-sizing:border-box">' + esc(noteRow ? noteRow.notes || '' : '') + '</textarea>' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px">' +
          '<span id="__onix_iv_notes_meta" style="font-size:.7rem;color:#9B9590">' + notesMetaText(noteRow) + '</span>' +
          '<button class="onix-btn onix-btn-primary" id="__onix_iv_notes_save" type="button">Save Notes</button>' +
        '</div>' +
        '<div id="__onix_iv_notes_status" style="font-size:.72rem;margin-top:6px"></div>';

      // Wire Save Notes — upsert against client_admin_notes (admin-only RLS,
      // see profiles.admin_notes gap this replaces). profile_id is the
      // primary key, so this is always exactly one row per client.
      var notesSaveBtn = document.getElementById('__onix_iv_notes_save');
      if (notesSaveBtn) {
