  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-success:#3B8B3B;--success-bg:#EBF5EB;--success-text:#2D6A2D;--warn-text:#A07818;--warn-bg:#FDF5E6;--serif:'Cormorant Garamond',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif}\n*{box-sizing:border-box;margin:0;padding:0}\nbody{font-family:var(--sans);color:var(--dark);background:var(--bg)}\na,button{cursor:pointer;text-decoration:none;background:none;border:none;font-family:inherit;color:inherit}\n.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;font-size:.78rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;border-radius:2px;transition:all .15s;border:1px solid transparent}\n.btn-red{background:var(--red);color:#fff;border-color:var(--red)}.btn-red:hover{background:#a93226}\n.btn-outline{background:transparent;color:var(--mid);border-color:var(--border)}.btn-outline:hover{border-color:var(--red);color:var(--red)}\n.card{background:#fff;border:1px solid var(--border);border-top:3px solid var(--red);padding:24px}\n.card-title{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:16px}\n.eyebrow{font-size:.67rem;letter-spacing:.2em;text-transform:uppercase;color:var(--red);font-weight:600}\n.rule{width:36px;height:2px;background:var(--red);margin-top:16px}\n.pill{display:inline-block;padding:3px 9px;border-radius:2px;font-size:.66rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}\n.pill.green{background:var(--success-bg);color:var(--success-text)}.pill.red{background:var(--red-light);color:var(--red)}\n.pill.amber{background:var(--warn-bg);color:var(--warn-text)}.pill.gray{background:#eee;color:#555}\n.field-label{display:block;font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}\n.field-input,.field-select,.field-textarea{width:100%;padding:11px 14px;border:1px solid var(--border);background:#fff;font-size:.85rem;font-family:var(--sans);color:var(--dark);outline:none;border-radius:2px;transition:border-color .15s}\n.field-input:focus,.field-select:focus,.field-textarea:focus{border-color:var(--red)}\n.field-textarea{resize:vertical;min-height:80px}\n.lang-toggle{display:flex;gap:4px}\n.lang-toggle button{padding:4px 10px;border-radius:2px;font-size:.68rem;font-weight:700;letter-spacing:.08em;color:var(--light);transition:all .14s;border:1px solid var(--border)}\n.lang-toggle button.active{background:var(--red);color:#fff;border-color:var(--red)}\n.reveal{opacity:0;transform:translateY(12px);transition:opacity .5s,transform .5s}\n.reveal.visible{opacity:1;transform:none}.reveal-d1{transition-delay:.08s}.reveal-d2{transition-delay:.16s}\n\n/* Shell */\n.app{min-height:100vh;display:grid;grid-template-columns:248px 1fr}\n.sidebar{background:var(--dark);color:#fff;padding:28px 0;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}\n.sidebar-brand{padding:0 24px 24px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:24px}\n.sidebar-logo{font-size:1.1rem;font-weight:900;letter-spacing:4px;color:#fff;text-transform:uppercase}\n.sidebar-logo span{color:var(--red)}\n.sidebar-brand-sep{width:1px;height:16px;background:rgba(255,255,255,.2)}\n.sidebar-brand-label{font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;color:var(--red);font-weight:700}\n.sidebar-section{padding:0 16px;margin-bottom:24px}\n.sidebar-section-lbl{font-size:.56rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.25);font-weight:700;padding:0 12px;margin-bottom:10px}\n.sidebar-item{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;color:rgba(255,255,255,.5);font-size:.82rem;font-weight:500;border-radius:2px;margin-bottom:1px;transition:all .14s;text-align:left;letter-spacing:.01em}\n.sidebar-item:hover{background:rgba(255,255,255,.05);color:rgba(255,255,255,.88)}\n.sidebar-item.active{background:var(--red);color:#fff;font-weight:600}\n.sidebar-item svg{flex-shrink:0;opacity:.7}.sidebar-item.active svg{opacity:1}\n.sidebar-item-badge{margin-left:auto;background:rgba(255,255,255,.15);color:#fff;padding:1px 7px;border-radius:10px;font-size:.62rem;font-weight:700}\n.sidebar-item.active .sidebar-item-badge{background:rgba(255,255,255,.25)}\n.sidebar-footer{margin-top:auto;padding:16px 24px;border-top:1px solid rgba(255,255,255,.06)}\n.sidebar-user{display:flex;align-items:center;gap:12px;margin-bottom:14px}\n.sidebar-avatar{width:36px;height:36px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;flex-shrink:0;overflow:hidden}\n.sidebar-user-name{font-size:.82rem;font-weight:600;color:#fff}\n.sidebar-user-role{font-size:.66rem;color:rgba(255,255,255,.4);letter-spacing:.08em;text-transform:uppercase;margin-top:1px}\n/* Topbar */\n.top-bar{background:#fff;border-bottom:1px solid var(--border);padding:0 40px;height:68px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}\n.top-bar-left{display:flex;align-items:center;gap:20px;flex:1}\n.top-bar-search{flex:1;max-width:380px;position:relative}\n.top-bar-search input{width:100%;padding:9px 14px 9px 38px;border:1px solid var(--border);background:var(--bg);border-radius:2px;font-size:.82rem;font-family:var(--sans);outline:none}\n.top-bar-search input:focus{border-color:var(--red);background:#fff}\n.top-bar-search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}\n.top-bar-right{display:flex;align-items:center;gap:16px}\n.icon-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--mid);transition:all .15s;position:relative}\n.icon-btn:hover{background:var(--bg);color:var(--dark)}\n.icon-btn-dot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--red);border:2px solid #fff}\n/* Main */\n.main{padding:40px;max-width:1400px}\n.page-hd{margin-bottom:32px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}\n.page-hd-text .eyebrow{margin-bottom:10px}\n.page-hd-text h1{font-family:var(--serif);font-style:italic;font-weight:500;font-size:2.4rem;line-height:1;letter-spacing:-.005em}\n.page-hd-text .rule{margin-top:18px}\n.page-hd-actions{display:flex;gap:10px}\n.view{display:none}.view.active{display:block}\n/* KPI */\n.kpi-grid{display:grid;gap:1px;background:var(--border);border:1px solid var(--border);border-top:3px solid var(--red);margin-bottom:32px}\n.kpi-grid.col-4{grid-template-columns:repeat(4,1fr)}.kpi-grid.col-3{grid-template-columns:repeat(3,1fr)}.kpi-grid.col-2{grid-template-columns:repeat(2,1fr)}\n.kpi-cell{background:#fff;padding:28px 22px}\n.kpi-label{font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;font-weight:600}\n.kpi-val{font-family:var(--serif);font-weight:500;font-size:2rem;color:var(--red);line-height:1}\n.kpi-val.dark{color:var(--dark)}.kpi-sub{font-size:.72rem;color:var(--light);margin-top:8px}\n.kpi-trend{font-size:.72rem;margin-top:8px}.kpi-trend.up{color:var(--success-text)}.kpi-trend.down{color:var(--red)}\n.row-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}\n.row-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:24px}\n.row-2w{display:grid;grid-template-columns:1.5fr 1fr;gap:20px;margin-bottom:24px}\n.detail-row{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #f4f4f4;gap:16px}\n.detail-row:last-child{border:none}\n.detail-key{font-size:.75rem;color:var(--light)}.detail-val{font-size:.85rem;font-weight:600;text-align:right}\n.progress-wrap{height:6px;background:#f0f0f0;border-radius:3px;overflow:hidden;margin:10px 0}\n.progress-fill{height:100%;background:var(--red);border-radius:3px;transition:width 1.2s cubic-bezier(.4,0,.2,1)}\n/* Tables */\n.tbl{width:100%;border-collapse:collapse}\n.tbl th{text-align:left;padding:10px 14px;font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;border-bottom:1px solid var(--border);background:var(--bg)}\n.tbl td{padding:13px 14px;font-size:.84rem;border-bottom:1px solid #f4f4f4}\n.tbl tr:hover td{background:var(--bg)}.tbl tr:last-child td{border-bottom:none}\n.tbl-actions{display:flex;gap:6px}\n.tbl-btn{padding:5px 10px;border:1px solid var(--border);background:#fff;font-size:.7rem;border-radius:2px;color:var(--mid);font-weight:600;letter-spacing:.03em;transition:all .14s}\n.tbl-btn:hover{border-color:var(--red);color:var(--red)}\n.tbl-btn.primary{background:var(--red);color:#fff;border-color:var(--red)}.tbl-btn.primary:hover{background:#a93226}\n.mini-avatar{width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;margin-right:8px;vertical-align:middle}\n/* Activity */\n.activity-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid #f4f4f4}\n.activity-item:last-child{border:none}\n.activity-dot{width:8px;height:8px;border-radius:50%;background:var(--red);margin-top:8px;flex-shrink:0}\n.activity-dot.gray{background:var(--border)}\n.activity-title{font-size:.84rem;font-weight:600;margin-bottom:2px}\n.activity-meta{font-size:.72rem;color:var(--light)}\n/* Tabs */\n.tabs{display:flex;gap:24px;border-bottom:1px solid var(--border);margin-bottom:24px}\n.tab-btn{padding:12px 0;font-size:.78rem;font-weight:600;color:var(--muted);letter-spacing:.04em;border-bottom:2px solid transparent;transition:all .14s;margin-bottom:-1px}\n.tab-btn:hover{color:var(--dark)}.tab-btn.active{color:var(--red);border-bottom-color:var(--red)}\n.tab-pane{display:none}.tab-pane.active{display:block}\n/* Raise */\n.raise-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:24px}\n.investor-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f4f4f4}\n.investor-row:last-child{border:none}\n.investor-name{font-size:.85rem;font-weight:600}\n.investor-meta{font-size:.72rem;color:var(--light);margin-top:2px}\n.investor-amount{font-family:var(--serif);font-style:italic;font-size:1.05rem;font-weight:500;color:var(--red)}\n/* i18n */\n.i18n-row{display:grid;grid-template-columns:180px 1fr 1fr;gap:14px;padding:12px 0;border-bottom:1px solid #f4f4f4;align-items:center}\n.i18n-key{font-family:'SFMono-Regular','Consolas',monospace;font-size:.72rem;color:var(--muted);letter-spacing:.02em}\n.i18n-input{padding:7px 10px;border:1px solid var(--border);background:#fff;font-size:.82rem;font-family:var(--sans);outline:none;border-radius:2px}\n.i18n-input:focus{border-color:var(--red)}\n@media(max-width:960px){\n  .app{grid-template-columns:1fr}\n  .sidebar{position:fixed;left:-260px;top:0;width:260px;z-index:300;transition:left .25s}\n  .sidebar.open{left:0}.mobile-menu-btn{display:flex !important}\n  .kpi-grid.col-4,.kpi-grid.col-3,.kpi-grid.col-2{grid-template-columns:repeat(2,1fr)}\n  .row-2,.row-2w,.row-3,.raise-grid{grid-template-columns:1fr}\n  .main{padding:24px}.top-bar{padding:0 20px}\n}\n.mobile-menu-btn{display:none}\n</style>\n\n</head>\n<body>\n<div class=\"app\">\n\n  <!-- Sidebar — Messages tab removed -->\n  <aside class=\"sidebar\" id=\"sidebar\">\n    <div class=\"sidebar-brand\">\n      <img src=\"1fbbaec9-af0c-42c9-9253-cd217ad9e74d\" alt=\"Onix Finance\" style=\"height:22px;width:auto;filter:brightness(0) invert(1)\">\n      <div class=\"sidebar-brand-sep\"></div>\n      <span class=\"sidebar-brand-label\">Admin</span>\n    </div>\n    <div class=\"sidebar-section\">\n      <div class=\"sidebar-section-lbl\">Overview</div>\n      <button class=\"sidebar-item active\" data-view=\"dashboard\" onclick=\"showView('dashboard')\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"9\"></rect><rect x=\"14\" y=\"3\" width=\"7\" height=\"5\"></rect><rect x=\"14\" y=\"12\" width=\"7\" height=\"9\"></rect><rect x=\"3\" y=\"16\" width=\"7\" height=\"5\"></rect></svg>\n        <span data-en=\"Dashboard\" data-es=\"Panel\">Dashboard</span>\n      </button>\n    </div>\n    <div class=\"sidebar-section\">\n      <div class=\"sidebar-section-lbl\" data-en=\"Lending\" data-es=\"Préstamos\">Lending</div>\n      <button class=\"sidebar-item\" data-view=\"applications\" onclick=\"showView('applications')\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"></path><polyline points=\"14 2 14 8 20 8\"></polyline></svg>\n        <span data-en=\"Applications\" data-es=\"Solicitudes\">Applications</span>\n        <span class=\"sidebar-item-badge\">7</span>\n      </button>\n      <button class=\"sidebar-item\" data-view=\"loans\" onclick=\"showView('loans')\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"2\" y=\"6\" width=\"20\" height=\"12\" rx=\"2\"></rect><circle cx=\"12\" cy=\"12\" r=\"3\"></circle></svg>\n        <span data-en=\"Active Loans\" data-es=\"Préstamos Activos\">Active Loans</span>\n      </button>\n    </div>\n    <div class=\"sidebar-section\">\n      <div class=\"sidebar-section-lbl\" data-en=\"Investments\" data-es=\"Inversiones\">Investments</div>\n      <button class=\"sidebar-item\" data-view=\"raises\" onclick=\"showView('raises')\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><polyline points=\"22 7 13.5 15.5 8.5 10.5 2 17\"></polyline><polyline points=\"16 7 22 7 22 13\"></polyline></svg>\n        <span data-en=\"Raises\" data-es=\"Captaciones\">Raises</span>\n      </button>\n      <button class=\"sidebar-item\" data-view=\"investors\" onclick=\"showView('investors')\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"></path><circle cx=\"9\" cy=\"7\" r=\"4\"></circle><path d=\"M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75\"></path></svg>\n        <span data-en=\"Investors\" data-es=\"Inversionistas\">Investors</span>\n      </button>\n    </div>\n    <div class=\"sidebar-section\">\n      <div class=\"sidebar-section-lbl\" data-en=\"Management\" data-es=\"Gestión\">Management</div>\n      <button class=\"sidebar-item\" data-view=\"clients\" onclick=\"showView('clients')\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2\"></path><circle cx=\"12\" cy=\"7\" r=\"4\"></circle></svg>\n        <span data-en=\"Clients\" data-es=\"Clientes\">Clients</span>\n      </button>\n      <button class=\"sidebar-item\" data-view=\"documents\" onclick=\"showView('documents')\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"></path><polyline points=\"14 2 14 8 20 8\"></polyline></svg>\n        <span data-en=\"Financial Reports\" data-es=\"Reportes Financieros\">Financial Reports</span>\n      </button>\n      \n    </div>\n    <div class=\"sidebar-section\">\n      <div class=\"sidebar-section-lbl\" data-en=\"System\" data-es=\"Sistema\">System</div>\n      <button class=\"sidebar-item\" data-view=\"reports\" onclick=\"showView('reports')\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><line x1=\"18\" y1=\"20\" x2=\"18\" y2=\"10\"></line><line x1=\"12\" y1=\"20\" x2=\"12\" y2=\"4\"></line><line x1=\"6\" y1=\"20\" x2=\"6\" y2=\"14\"></line></svg>\n        <span data-en=\"Reports\" data-es=\"Reportes\">Reports</span>\n      </button>\n      <button class=\"sidebar-item\" data-view=\"users\" onclick=\"showView('users')\">\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"12\" cy=\"12\" r=\"3\"></circle><path d=\"M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z\"></path></svg>\n        <span data-en=\"Team &amp; Settings\" data-es=\"Equipo\">Team &amp; Settings</span>\n      </button>\n      \n    </div>\n    <div class=\"sidebar-footer\">\n      <div class=\"sidebar-user\">\n        <!-- Avatar: placeholder for photo — replace src when photo is provided -->\n        <div class=\"sidebar-avatar\" title=\"Elena Vargas — replace with photo\">EV</div>\n        <div>\n          <div class=\"sidebar-user-name\">Elena Vargas</div>\n          <div class=\"sidebar-user-role\" data-en=\"Principal\" data-es=\"Socia\">Principal</div>\n        </div>\n      </div>\n      <button class=\"sidebar-item\" onclick=\"signOut()\" style=\"width:100%;padding:10px 12px\">\n        <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9\"></path></svg>\n        <span data-en=\"Sign Out\" data-es=\"Cerrar Sesión\">Sign Out</span>\n      </button>\n    </div>\n  </aside>\n\n  <div>\n    <header class=\"top-bar\">\n      <div class=\"top-bar-left\">\n        <button class=\"mobile-menu-btn icon-btn\" onclick=\"document.getElementById('sidebar').classList.toggle('open')\">\n          <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><line x1=\"3\" y1=\"6\" x2=\"21\" y2=\"6\"></line><line x1=\"3\" y1=\"12\" x2=\"21\" y2=\"12\"></line><line x1=\"3\" y1=\"18\" x2=\"21\" y2=\"18\"></line></svg>\n        </button>\n        <div class=\"top-bar-search\">\n          <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"11\" cy=\"11\" r=\"8\"></circle><line x1=\"21\" y1=\"21\" x2=\"16.65\" y2=\"16.65\"></line></svg>\n          <input data-ph-en=\"Search clients, loans, applications…\" data-ph-es=\"Buscar clientes, préstamos…\" placeholder=\"Search clients, loans, applications…\">\n        </div>\n      </div>\n      <div class=\"top-bar-right\">\n        <div class=\"lang-toggle\"><button data-lang-set=\"en\" class=\"active\">EN</button><button data-lang-set=\"es\">ES</button></div>\n        <button class=\"icon-btn\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9\"></path><path d=\"M13.73 21a2 2 0 0 1-3.46 0\"></path></svg><span class=\"icon-btn-dot\"></span></button>\n        <button class=\"icon-btn\" onclick=\"signOut()\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9\"></path></svg></button>\n      </div>\n    </header>\n\n    <main class=\"main\">\n\n      <!-- DASHBOARD — Loan Health → Loan Type pie; Portfolio by Asset → Deposit Growth line -->\n      <div class=\"view active\" id=\"view-dashboard\">\n        <div class=\"page-hd reveal\">\n          <div class=\"page-hd-text\"><div class=\"eyebrow\" data-en=\"Admin Console\" data-es=\"Consola Admin\">Admin Console</div><h1 data-en=\"Operations overview.\" data-es=\"Resumen de operaciones.\">Operations overview.</h1><div class=\"rule\"></div></div>\n          <div class=\"page-hd-actions\">\n            <button class=\"btn btn-outline\"><span data-en=\"Export CSV\" data-es=\"Exportar CSV\">Export CSV</span></button>\n            <button class=\"btn btn-red\"><span data-en=\"+ New Loan\" data-es=\"+ Nuevo Préstamo\">+ New Loan</span></button>\n          </div>\n        </div>\n        <!-- 7-section Portfolio Overview grid -->\n        <div class=\"reveal\" style=\"border:1px solid var(--border);border-top:3px solid var(--red);background:#fff;margin-bottom:32px\">\n          <div style=\"padding:20px 28px 10px;border-bottom:1px solid var(--border)\">\n            <div style=\"font-family:var(--serif);font-style:italic;font-weight:500;font-size:1.3rem;color:var(--dark)\">Portfolio Overview</div>\n            <div style=\"width:32px;height:2px;background:var(--red);margin-top:8px\"></div>\n          </div>\n          <!-- Row 1: 4 cells -->\n          <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-bottom:1px solid var(--border)\">\n            <div style=\"padding:22px 28px;border-right:1px solid var(--border)\">\n              <div style=\"font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:12px\" data-en=\"Loan Portfolio\" data-es=\"Cartera de Préstamos\">Loan Portfolio</div>\n              <div style=\"font-family:var(--serif);font-style:italic;font-weight:500;font-size:2.2rem;color:var(--red);line-height:1\">$35.5MM</div>\n            </div>\n            <div style=\"padding:22px 28px;border-right:1px solid var(--border)\">\n              <div style=\"font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:12px\" data-en=\"Total Deposits\" data-es=\"Depósitos Totales\">Total Deposits</div>\n              <div style=\"font-family:var(--serif);font-style:italic;font-weight:500;font-size:2.2rem;color:var(--red);line-height:1\">$41.6MM</div>\n            </div>\n            <div style=\"padding:22px 28px;border-right:1px solid var(--border)\">\n              <div style=\"font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:12px\" data-en=\"Portfolio LTV\" data-es=\"LTV del Portafolio\">Portfolio LTV</div>\n              <div style=\"font-family:var(--serif);font-style:italic;font-weight:500;font-size:2.2rem;color:var(--red);line-height:1\">33%</div>\n            </div>\n            <div style=\"padding:22px 28px\">\n              <div style=\"font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:12px\" data-en=\"Active Clients\" data-es=\"Clientes Activos\">Active Clients</div>\n              <div style=\"font-family:var(--serif);font-style:italic;font-weight:500;font-size:2.2rem;color:var(--dark);line-height:1\">148</div>\n            </div>\n          </div>\n          <!-- Row 2: 3 cells -->\n          <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:0\">\n            <div style=\"padding:22px 28px;border-right:1px solid var(--border)\">\n              <div style=\"font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:12px\" data-en=\"Active Loans\" data-es=\"Préstamos Activos\">Active Loans</div>\n              <div style=\"font-family:var(--serif);font-style:italic;font-weight:500;font-size:2.2rem;color:var(--dark);line-height:1\">62</div>\n            </div>\n            <div style=\"padding:22px 28px;border-right:1px solid var(--border)\">\n              <div style=\"font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:12px\" data-en=\"Pending Applications\" data-es=\"Solicitudes Pendientes\">Pending Applications</div>\n              <div style=\"font-family:var(--serif);font-style:italic;font-weight:500;font-size:2.2rem;color:var(--red);line-height:1\">4</div>\n            </div>\n            <div style=\"padding:22px 28px\">\n              <div style=\"font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:12px\" data-en=\"Open Raises\" data-es=\"Captaciones Abiertas\">Open Raises</div>\n              <div style=\"font-family:var(--serif);font-style:italic;font-weight:500;font-size:2.2rem;color:var(--dark);line-height:1\">3</div>\n            </div>\n          </div>\n        </div>\n        <div class=\"row-2w\">\n          <div class=\"card reveal\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:14px\">\n              <span class=\"card-title\" style=\"margin-bottom:0\" data-en=\"Originations · Last 12 Months\" data-es=\"Originaciones · Últimos 12 Meses\">Originations · Last 12 Months</span>\n              <span style=\"font-size:.72rem;color:var(--muted)\">Monthly volume ($M)</span>\n            </div>\n            <div style=\"height:240px\"><canvas id=\"origChart\"></canvas></div>\n          </div>\n          <!-- Loan Type pie chart replaces Loan Health -->\n          <div class=\"card reveal reveal-d1\">\n            <div class=\"card-title\" data-en=\"Loan Type Breakdown\" data-es=\"Tipos de Préstamo\">Loan Type Breakdown</div>\n            <div style=\"height:160px;margin-bottom:12px\"><canvas id=\"loanTypeChart\"></canvas></div>\n            <div id=\"loanTypeLegend\" style=\"font-size:.8rem\"></div>\n          </div>\n        </div>\n        <div class=\"row-2\">\n          <div class=\"card reveal\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:14px\">\n              <span class=\"card-title\" style=\"margin-bottom:0\" data-en=\"Recent Ac
