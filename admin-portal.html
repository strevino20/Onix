    async function handleClientDocUpload(e){
      e.preventDefault();
      if (!currentDocsProfileId) return;
      var fileEl = document.getElementById('__onix_cd_file');
      var catEl  = document.getElementById('__onix_cd_category');
      var btn    = document.getElementById('__onix_cd_upload_btn');
      var msg    = document.getElementById('__onix_cd_upload_msg');
      var file   = fileEl.files && fileEl.files[0];
      if (!file) { msg.textContent = 'Pick a file first.'; msg.style.color = '#C0392B'; return; }
      var safeName = file.name.replace(/[^a-zA-Z0-9._-]+/g, '_');
      var key = currentDocsProfileId + '/' + Date.now() + '-' + safeName;
      btn.disabled = true; var origLbl = btn.textContent; btn.textContent = 'Uploading…';
      msg.style.color = '#9B9590'; msg.textContent = 'Uploading ' + file.name + '…';
      var c = OnixDB.client;
      var upRes = await c.storage.from(CL_DOCS_BUCKET).upload(key, file, { upsert: false, contentType: file.type || undefined });
      if (upRes.error) {
        msg.style.color = '#C0392B'; msg.textContent = 'Upload failed: ' + upRes.error.message;
        btn.disabled = false; btn.textContent = origLbl;
        return;
      }
      var ins = await c.from('client_documents').insert({
        profile_id: currentDocsProfileId,
        category: catEl.value || 'other',
        name: file.name,
        storage_path: key
      });
      if (ins.error) {
        // Roll the file back so the bucket doesn't drift from the table.
        c.storage.from(CL_DOCS_BUCKET).remove([key]).catch(function(){});
        msg.style.color = '#C0392B'; msg.textContent = 'Saved file but DB insert failed: ' + ins.error.message;
        btn.disabled = false; btn.textContent = origLbl;
        return;
      }
      msg.style.color = '#2D6A2D'; msg.textContent = 'Uploaded ' + file.name + '.';
      fileEl.value = '';
      btn.disabled = false; btn.textContent = origLbl;
      // Re-render the list so the new row appears immediately.
      openClientDocs(currentDocsProfileId);
    }

    async function openClientDocs(profileId){
      var overlay = ensureDocsModal();
      currentDocsProfileId = profileId;
      var c = OnixDB.client;
      var [pRes, dRes] = await Promise.all([
        c.from('profiles').select('full_name, email').eq('id', profileId).single(),
        c.from('client_documents').select('*').eq('profile_id', profileId).order('uploaded_at',{ascending:false})
      ]);
      if (pRes.error)  console.error('[onix-clients] profile fetch failed:', pRes.error);
      if (dRes.error)  console.error('[onix-clients] docs fetch failed:', dRes.error);
      var p    = pRes.data || {};
      var docs = dRes.data || [];
      var name = up(p.full_name) || p.email || 'Client';

      document.getElementById('__onix_cd_name').textContent = name;
      document.getElementById('__onix_cd_sub').textContent  = docs.length + ' document' + (docs.length === 1 ? '' : 's') + ' on file';

      var body = document.getElementById('__onix_cd_body');
      var grouped = {};
      docs.forEach(function(d){
        var cat = d.category || 'other';
        (grouped[cat] = grouped[cat] || []).push(d);
      });
      // Required-doc rule: every client must have ID OR Passport (either
      // satisfies), a Proof of Address, and an RFC / Tax ID on file. Flag
      // missing sections with an urgent pulsing badge so the admin can see at
      // a glance which docs to chase.
      var hasIdDoc       = (grouped['id'] || []).length > 0;
      var hasPassportDoc = (grouped['passport'] || []).length > 0;
      var hasEitherIdent = hasIdDoc || hasPassportDoc;
      function isMissingForGroup(key){
        if (key === 'id_or_passport')   return !hasEitherIdent;
        if (key === 'proof_of_address') return (grouped['proof_of_address'] || []).length === 0;
        if (key === 'tax')              return (grouped['tax'] || []).length === 0;
        return false;
      }
      var missingBadge = '<span class="oac-doc-missing">⚠ Missing</span>';
      var linkStyle = 'font-size:.66rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#C0392B;text-decoration:none;border:1px solid #C0392B;padding:6px 12px;border-radius:2px;cursor:pointer;background:transparent';
      // Always render a section per display group so the admin always sees
      // every type the client could have on file. Empty groups show a quiet
      // 'No documents uploaded yet' line.
      var html = '';
      DOC_DISPLAY_GROUPS.forEach(function(group){
        var list = group.categories.reduce(function(acc, cat){ return acc.concat(grouped[cat] || []); }, []);
        var missing = isMissingForGroup(group.key);
        html +=
          '<div style="margin-bottom:18px' + (missing ? ';padding:10px 12px;border:1px solid rgba(192,57,43,.25);border-left:3px solid #C0392B;background:#FFF6F5' : '') + '">' +
            '<div style="font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:#1A1A1A;font-weight:700;margin-bottom:8px;display:flex;align-items:center;flex-wrap:wrap">' +
              '<span>' + esc(group.label) + '</span>' +
              (list.length ? ' <span style="color:#9B9590;font-weight:600;margin-left:6px">(' + list.length + ')</span>' : '') +
              (missing ? ' ' + missingBadge : '') +
            '</div>';
        if (!list.length) {
          html +=
            '<div style="padding:10px 14px;background:#F8F7F5;border-left:3px solid #E8E8E8;color:#9B9590;font-style:italic;font-size:.78rem">' +
              'No documents uploaded yet.' +
            '</div>';
        } else {
          html +=
            '<div style="display:flex;flex-direction:column;gap:6px">' +
              list.map(function(d){
                var meta = (function(){
                  try { return new Date(d.uploaded_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
                  catch(_) { return ''; }
                })();
                var source = d.storage_path ? 'Uploaded' : (d.dropbox_url ? 'Dropbox' : '');
                var action = d.storage_path
                  ? '<a href="#" data-storage-path="' + esc(d.storage_path) + '" style="' + linkStyle + '">View ↗</a>'
                  : (d.dropbox_url
                      ? '<a href="' + esc(d.dropbox_url) + '" target="_blank" rel="noopener" style="' + linkStyle + '">View ↗</a>'
                      : '<span style="font-size:.66rem;color:#9B9590">No link</span>');
                return '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;background:#F8F7F5;border-left:3px solid #C0392B">' +
                  '<div style="min-width:0">' +
                    '<div style="font-size:.84rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(d.name) + '</div>' +
                    '<div style="font-size:.7rem;color:#9B9590;margin-top:2px">' + meta + (source ? ' · ' + source : '') + '</div>' +
                  '</div>' +
                  action +
                '</div>';
              }).join('') +
            '</div>';
        }
        html += '</div>';
      });
      body.innerHTML = html;
      // Clear any stale upload-feedback line
      var msg = document.getElementById('__onix_cd_upload_msg');

      overlay.classList.add('show');
    }

    // Click delegation for the new buttons. Use capture so we run before
    // any other handler that might intercept generic "View" clicks.
    document.addEventListener('click', function(e){
      var btn = e.target && e.target.closest && e.target.closest('button');
      if (!btn) return;

      } else if (btn.hasAttribute('data-cl-docs')) {
        e.preventDefault(); e.stopPropagation();
        openClientDocs(pid);
      }
    }, true);
  });

  /* =====================================================================
     GLOBAL SEARCH — wire the .top-bar-search input to live-filter the
     active tab's table by textContent. Most tabs are filtered directly.
     The Applications tab has its own local search (#__onix_app_search);
     we relay the global query into that input so the two don't fight.
     ===================================================================== */
  window.addEventListener('load', function(){
    var INPUT_SEL = '.top-bar-search input';
    var input = null;

    function getInput(){
      if (input && document.body.contains(input)) return input;
      input = document.querySelector(INPUT_SEL);
      return input;
    }

    function activeView(){
      var v = document.querySelector('.view.active');
      if (v) return v;
      var all = document.querySelectorAll('.view');
      for (var i=0; i<all.length; i++){
        if (window.getComputedStyle(all[i]).display !== 'none') return all[i];
      }
      return null;
    }

    function applyFilter(){
      var el = getInput();
      if (!el) return;
      var raw = (el.value || '').trim();
      var q = raw.toLowerCase();
      var av = activeView();
      if (!av) return;

      // Applications tab has its own filter — relay the query and bail.
      if (av.id === 'view-applications') {
        var local = document.getElementById('__onix_app_search');
        if (local) {
          if (local.value !== raw) {
            local.value = raw;
            local.dispatchEvent(new Event('input', { bubbles: true }));
          }
          return;
        }
      }

      av.querySelectorAll('table').forEach(function(t){
        var rows = t.querySelectorAll('tbody tr');
        rows.forEach(function(tr){
          if (!q) { tr.style.display = ''; return; }
          var text = (tr.textContent || '').toLowerCase();
          tr.style.display = text.indexOf(q) >= 0 ? '' : 'none';
        });
      });
    }

    function wireInput(){
      var el = getInput();
      if (!el || el.__onix_search_wired) return;
      el.__onix_search_wired = true;
      el.addEventListener('input', applyFilter);
    }

    var debounceT;
    function debouncedApply(){
      clearTimeout(debounceT);
      debounceT = setTimeout(applyFilter, 80);
    }

    setTimeout(function(){
      wireInput();
      applyFilter();
      var root = document.querySelector('.main') || document.body;
      // Watch for view switches (class flips) and table repaints (childList).
      // Style changes are intentionally not observed to avoid the apply-loop
      // when we set tr.style.display.
      new MutationObserver(function(){
        wireInput();
        debouncedApply();
      }).observe(root, { subtree:true, childList:true, attributes:true, attributeFilter:['class'] });
      // The search input itself may not exist until the bundler unpacks the
      // top bar; keep retrying to wire it.
      var topbar = document.querySelector('.top-bar') || document.body;
      new MutationObserver(wireInput).observe(topbar, { subtree:true, childList:true });
    }, 1400);
  });

        '#__onix_docs_modal .odm-slot-btn.sel{background:#C0392B;color:#fff;border-color:#C0392B}',

        '#__onix_docs_modal .odm-actions{margin-top:20px;display:flex;justify-content:flex-end;gap:10px;padding-top:16px;border-top:1px solid #f0f0f0}',
        '#__onix_docs_modal .odm-actions button{padding:10px 18px;font:700 .72rem/1 "DM Sans",sans-serif;letter-spacing:.08em;text-transform:uppercase;border-radius:2px;border:1px solid transparent;cursor:pointer;transition:all .14s}',
        '#__onix_docs_modal .odm-cancel{background:transparent;color:#888;border-color:#E8E8E8}',
        '#__onix_docs_modal .odm-cancel:hover{border-color:#C0392B;color:#C0392B}',
        '#__onix_docs_modal .odm-submit{background:#C0392B;color:#fff;border-color:#C0392B}',
        '#__onix_docs_modal .odm-submit:hover{background:#a93226}',
        '#__onix_docs_modal .odm-submit:disabled{opacity:.5;cursor:not-allowed;background:#C0392B}',
        '#__onix_docs_modal .odm-success{display:none;padding:12px 14px;background:#EBF5EB;color:#2D6A2D;font-size:.84rem;font-weight:600;border-left:3px solid #3B8B3B;margin-top:14px;animation:__onix_pop .2s cubic-bezier(.2,.8,.2,1)}',
        '#__onix_docs_modal .odm-success.show{display:block}',
      ].join('\n');
      document.head.appendChild(s);
    }

    // --- Supabase data layer --------------------------------------------
    // Files live in storage bucket `admin-documents`, metadata in
    // public.admin_documents. RLS is admin-only on both.
    var BUCKET = 'admin-documents';
    var rowsCache = [];     // last fetched admin_documents rows
    var lastFetchAt = 0;

    function fmtSize(b){
      if (b == null) return '';
      if (b < 1024) return b + ' B';
      if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
      return (b/1048576).toFixed(1) + ' MB';
    }
    function fmtDate(iso){
      try { return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
      catch(_) { return ''; }
    }

    async function fetchDocs(force){
      if (!window.OnixDB || !window.OnixDB.client) return rowsCache;
      if (!force && rowsCache.length && (Date.now() - lastFetchAt) < 2000) return rowsCache;
      var r = await OnixDB.client.from('admin_documents').select('*');
      if (r.error) { console.error('[onix-docs] fetch failed:', r.error); return rowsCache; }
      rowsCache = r.data || [];
      lastFetchAt = Date.now();
      return rowsCache;
    }

    // Fixed top-level periods, each with a fixed row of slots. Quarterly
    // slots are the four quarters; Annual slots are specific years (add a
    // new year here each January — no DB migration needed, `category` is
    // a free-text column).
    var SCOPES = [
      { key:'annual',    label:'Annual',    desc:'Year-end financial reports.',
        icon:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
        slots: ['2026','2025','2024','2023'] },
      { key:'quarterly', label:'Quarterly', desc:'Quarterly financial reports.',
        icon:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>',
        slots: ['Q1','Q2','Q3','Q4'] }
    ];
    function scopeByKey(key){
      for (var i=0;i<SCOPES.length;i++) if (SCOPES[i].key === key) return SCOPES[i];
      return null;
    }
    function scopeLabel(key){
      var sc = scopeByKey(key);
      return sc ? sc.label : key;
    }

    // Group rows into { annual:{'2026':[rows],...}, quarterly:{'Q1':[rows],...} }
    function groupRows(rows){
      var g = {};
      SCOPES.forEach(function(sc){
        g[sc.key] = {};
        sc.slots.forEach(function(slot){ g[sc.key][slot] = []; });
      });
      rows.forEach(function(r){
        var bucket = g[r.scope];
        if (!bucket) return;
        (bucket[r.category] = bucket[r.category] || []).push(r);
      });
      return g;
    }

    function sortNewestFirst(files){
      var arr = files.slice();
      arr.sort(function(a,b){ return new Date(b.uploaded_at) - new Date(a.uploaded_at); });
      return arr;
    }

    // --- Navigation state --------------------------------------------------
    var nav = { level:'root', cat:null }; // cat: 'annual'|'quarterly'

    // --- Rendering -------------------------------------------------------
    function escape(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]; }); }
    function escapeAttr(s){ return escape(s); }

    async function render(){
      var root = document.getElementById('__onix_docs_root');
      if (!root) return;
      var rows = await fetchDocs();
      var g = groupRows(rows);

      // Breadcrumb
      var crumb = '<div class="od-crumb">';
      crumb += '<button data-go="root">Financial Reports</button>';
      if (nav.level === 'files') {
        crumb += '<span class="od-sep">›</span>';
        crumb += '<span class="od-crumb-now">' + escape(scopeLabel(nav.cat)) + '</span>';
      }
      crumb += '</div>';

      var body = '';

      if (nav.level === 'root') {
        body += '<div class="od-grid" style="grid-template-columns:repeat(' + SCOPES.length + ',1fr)">';
        SCOPES.forEach(function(sc){
          var count = 0;
          sc.slots.forEach(function(slot){ count += (g[sc.key][slot] || []).length; });
          body += '<button class="od-cat" data-cat="' + sc.key + '">' +
            '<div class="od-cat-icon">' + sc.icon + '</div>' +
            '<div class="od-cat-label">' + sc.label + '</div>' +
            '<div class="od-cat-desc">' + sc.desc + '</div>' +
            '<div class="od-cat-meta">' + count + ' doc' + (count===1?'':'s') + ' <span class="od-arrow">→</span></div>' +
            '</button>';
        });
        body += '</div>';
      } else if (nav.level === 'files') {
        var sc = scopeByKey(nav.cat);
        body += '<div class="od-toolbar">' +
                  '<button class="od-up" data-open-upload data-prefill-scope="' + escapeAttr(nav.cat) + '">' +
                    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>' +
                    ' Upload to ' + escape(sc.label) +
                  '</button>' +
                '</div>';

        body += '<div class="od-slot-table"><div class="od-slot-grid" style="grid-template-columns:repeat(' + sc.slots.length + ',1fr)">';
        sc.slots.forEach(function(slot){
          var files = sortNewestFirst(g[sc.key][slot] || []);
          body += '<div class="od-slot-col">';
          body += '<div class="od-slot-hd">' + escape(slot) +
                  '<button class="od-slot-add" data-slot-upload="' + escapeAttr(slot) + '" title="Upload to ' + escapeAttr(slot) + '">+</button></div>';
          body += '<div class="od-slot-files">';
          if (!files.length) {
            body += '<div class="od-slot-empty">No file yet</div>';
          } else {
            files.forEach(function(f){
              body += '<div class="od-slot-file">' +
                      '<button class="od-slot-file-name" data-view="' + escapeAttr(f.storage_path) + '">' + escape(f.name) + '</button>' +
                      '<div class="od-slot-file-meta"><span>' + fmtSize(f.size_bytes) + ' · ' + fmtDate(f.uploaded_at) + '</span>' +
                      '<button class="od-slot-file-del" data-del="' + escapeAttr(f.id) + '" data-path="' + escapeAttr(f.storage_path) + '" title="Delete">&times;</button></div>' +
                      '</div>';
            });
          }
          body += '</div></div>';
        });
        body += '</div></div>';
      }

      root.innerHTML = crumb + body;
      bindEvents(root);
    }

    function bindEvents(root){
      root.querySelectorAll('[data-go]').forEach(function(b){
        b.addEventListener('click', function(){
          nav = {level:'root', cat:null};
          render();
        });
      });
      root.querySelectorAll('[data-cat]').forEach(function(b){
        b.addEventListener('click', function(){
          nav = {level:'files', cat:b.getAttribute('data-cat')};
          render();
        });
      });
      // Upload buttons — page-level (scope only) and per-cell (scope + slot)
      root.querySelectorAll('[data-open-upload]').forEach(function(b){
        b.addEventListener('click', function(){
          openUploadModal({ scope: b.getAttribute('data-prefill-scope') || nav.cat || null });
        });
      });
      root.querySelectorAll('[data-slot-upload]').forEach(function(b){
        b.addEventListener('click', function(){
          openUploadModal({ scope: nav.cat, slot: b.getAttribute('data-slot-upload') });
        });
      });
      // View / Delete
      root.querySelectorAll('[data-view]').forEach(function(b){
        b.addEventListener('click', async function(){
          var path = b.getAttribute('data-view');
          var orig = b.textContent;
          b.textContent = 'Opening…';
          var r = await OnixDB.client.storage.from(BUCKET).createSignedUrl(path, 3600);
          b.textContent = orig;
          if (r.error || !r.data) { alert('Could not open file: ' + (r.error && r.error.message || 'unknown')); return; }
          window.open(r.data.signedUrl, '_blank', 'noopener');
        });
      });
      root.querySelectorAll('[data-del]').forEach(function(b){
        b.addEventListener('click', async function(){
          if (!confirm('Delete this file?')) return;
          var id = b.getAttribute('data-del');
          var path = b.getAttribute('data-path');
          b.disabled = true;
          var del = await OnixDB.client.from('admin_documents').delete().eq('id', id);
          if (del.error) { alert('Could not delete: ' + del.error.message); b.disabled = false; return; }
          // Best-effort storage cleanup (RLS allows admin to remove)
          OnixDB.client.storage.from(BUCKET).remove([path]).catch(function(){});
          render(); // re-fetch + re-render
        });
      });
    }

    // --- Upload modal ---------------------------------------------------
    function ensureUploadModal(){
      if (document.getElementById('__onix_docs_modal')) return;
      var m = document.createElement('div');
      m.id = '__onix_docs_modal';
      m.innerHTML =
        '<div class="odm-card" role="dialog" aria-modal="true">' +
          '<div class="odm-eyebrow">Financial Reports</div>' +
          '<h2>Upload Document</h2>' +
          '<div class="odm-sub">Sort the file into ' + SCOPES.map(function(sc){ return sc.label; }).join(' or ') + ', then a specific period.</div>' +
          '<label>Period</label>' +
          '<div class="odm-scope" style="grid-template-columns:repeat(' + SCOPES.length + ',1fr)">' +
            SCOPES.map(function(sc){
              return '<button type="button" class="odm-scope-btn" data-scope="' + sc.key + '"><b>' + sc.label + '</b><span>' + sc.desc + '</span></button>';
            }).join('') +
          '</div>' +
          '<div id="odm-slots" style="display:none">' +
            '<label id="odm-slots-label">Which one?</label>' +
            '<div class="odm-slots" id="odm-slots-grid"></div>' +
          '</div>' +
          '<label>File</label>' +
          '<input type="file" id="odm-file" accept="application/pdf,image/*,.ppt,.pptx,.key,.xls,.xlsx,.csv,.doc,.docx">' +
          '<div class="odm-err" id="odm-err"></div>' +
          '<div class="odm-success" id="odm-success"></div>' +
          '<div class="odm-actions">' +
            '<button class="odm-cancel" type="button" id="odm-cancel">Close</button>' +
            '<button class="odm-submit" type="button" id="odm-submit" disabled>Upload</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(m);
      m.addEventListener('click', function(e){ if (e.target === m) closeUploadModal(); });
      m.querySelector('#odm-cancel').addEventListener('click', closeUploadModal);

      var state = { scope:null, slot:null };

      function renderSlots(){
        var wrap = m.querySelector('#odm-slots');
        var grid = m.querySelector('#odm-slots-grid');
        var sc = scopeByKey(state.scope);
        if (!sc) { wrap.style.display = 'none'; return; }
        wrap.style.display = '';
        grid.style.gridTemplateColumns = 'repeat(' + sc.slots.length + ',1fr)';
        grid.innerHTML = sc.slots.map(function(slot){
          return '<button type="button" class="odm-slot-btn" data-slot="' + escapeAttr(slot) + '">' + escape(slot) + '</button>';
        }).join('');
        grid.querySelectorAll('[data-slot]').forEach(function(b){
          b.addEventListener('click', function(){ setSlot(b.getAttribute('data-slot')); });
        });
      }
      function setScope(s){
        state.scope = s;
        state.slot = null;
        m.querySelectorAll('[data-scope]').forEach(function(b){ b.classList.toggle('sel', b.getAttribute('data-scope') === s); });
        renderSlots();
        refreshSubmit();
      }
      function setSlot(slot){
        state.slot = slot;
        m.querySelectorAll('[data-slot]').forEach(function(b){ b.classList.toggle('sel', b.getAttribute('data-slot') === slot); });
        refreshSubmit();
      }
      function refreshSubmit(){
        var f = m.querySelector('#odm-file').files && m.querySelector('#odm-file').files[0];
        var ok = !!state.scope && !!state.slot && !!f;
        m.querySelector('#odm-submit').disabled = !ok;
      }
      m.querySelectorAll('[data-scope]').forEach(function(b){ b.addEventListener('click', function(){ setScope(b.getAttribute('data-scope')); }); });
      m.querySelector('#odm-file').addEventListener('change', refreshSubmit);

      m.querySelector('#odm-submit').addEventListener('click', async function(){
        var fileEl = m.querySelector('#odm-file');
        var file = fileEl.files && fileEl.files[0];
        var errEl = m.querySelector('#odm-err');
        var sucEl = m.querySelector('#odm-success');
        errEl.textContent = '';
        sucEl.classList.remove('show');
        if (!file || !state.scope || !state.slot) { errEl.textContent = 'Please complete every field.'; return; }
        var btn = m.querySelector('#odm-submit');
        btn.disabled = true; var orig = btn.textContent; btn.textContent = 'Uploading…';
        var safeSlot = String(state.slot).replace(/[^a-zA-Z0-9._-]+/g, '_');
        var safeName = String(file.name).replace(/[^a-zA-Z0-9._-]+/g, '_');
        var path = state.scope + '/' + safeSlot + '/' + Date.now() + '-' + safeName;
        var up = await OnixDB.client.storage.from(BUCKET).upload(path, file, { upsert:false, contentType: file.type || undefined });
        if (up.error) { errEl.textContent = 'Upload failed: ' + up.error.message; btn.disabled = false; btn.textContent = orig; return; }
        var ins = await OnixDB.client.from('admin_documents').insert({
          scope:        state.scope,
          holder_name:  state.slot,
          category:     state.slot,
          name:         file.name,
          size_bytes:   file.size,
          content_type: file.type || null,
          storage_path: path
        });
        if (ins.error) {
          errEl.textContent = 'Saved file but DB insert failed: ' + ins.error.message;
          OnixDB.client.storage.from(BUCKET).remove([path]).catch(function(){});
          btn.disabled = false; btn.textContent = orig;
          return;
        }
        // Stay in the modal. Show an inline success banner, refresh data so
        // the new file shows up immediately, and re-render the current view.
        await fetchDocs(true);
        render();
        sucEl.textContent = '✓ Uploaded "' + file.name + '" to ' + scopeLabel(state.scope) + ' ' + state.slot + '. Add another or close.';
        sucEl.classList.add('show');
        // Reset the file input + leave scope/slot set so they can
        // immediately drop another doc into the same destination.
        fileEl.value = '';
        btn.textContent = orig;
        refreshSubmit();
      });

      // Expose setters so openUploadModal can prefill
      m.__setScope = setScope;
      m.__setSlot = setSlot;
      m.__resetState = function(){
        state = { scope:null, slot:null };
        m.querySelectorAll('.sel').forEach(function(b){ b.classList.remove('sel'); });
        m.querySelector('#odm-slots').style.display = 'none';
        m.querySelector('#odm-file').value='';
        m.querySelector('#odm-submit').disabled = true;
        m.querySelector('#odm-err').textContent='';
        var sucEl = m.querySelector('#odm-success');
        if (sucEl) { sucEl.textContent = ''; sucEl.classList.remove('show'); }
      };
    }

    function openUploadModal(prefill){
      ensureUploadModal();
      var m = document.getElementById('__onix_docs_modal');
      m.__resetState();
      if (prefill && prefill.scope) m.__setScope(prefill.scope);
      if (prefill && prefill.slot) m.__setSlot(prefill.slot);
      m.classList.add('open');
    }

    function closeUploadModal(){
      var m = document.getElementById('__onix_docs_modal');
      if (m) m.classList.remove('open');
    }

    // --- Detect & take over the Documents view --------------------------
    // Detect by the view's stable internal id, not its heading text. The id
    // has survived three rename/rework passes on this tab's copy untouched;
    // the heading text has not — a previous rename to "Financial Reports"
    // without updating this detection's old text-match regex broke it
    // silently, falling back to the dead placeholder markup with no error.
    function isDocumentsView() {
      return document.getElementById('view-documents');
    }

    function takeover() {
      injectStyles();
      var view = isDocumentsView();
      if (!view) {
        // Not on Documents — clean up if we previously injected
        var existing = document.getElementById('__onix_docs_root');
        if (existing) {
          var v = existing.closest('.view') || existing.parentElement;
          if (v) {
            [].slice.call(v.children).forEach(function(c){
              if (c.id !== '__onix_docs_root' && c.dataset.onixHidden === '1') {
                c.style.display = '';
                delete c.dataset.onixHidden;
              }
            });
          }
          existing.remove();
        }
        return;
      }
      if (view.querySelector('#__onix_docs_root')) return; // already injected

      // Page header (contains the h1 + the bundle's own "+ Upload" button).
      var pageHd = view.querySelector('.page-hd');
      if (!pageHd) {
        console.warn('[onix-docs] Financial Reports tab structure not found — real data view may not have loaded');
        return;
      }

      // Wire the bundle's "+ Upload" button (if present) to our modal.
      var uploadBtn = null;
      [].slice.call(pageHd.querySelectorAll('button')).forEach(function(b){
        var t = (b.textContent || '').trim();
        if (/^\+\s*(Upload|Subir)/i.test(t) && !b.dataset.onixWired) {
          uploadBtn = b;
        }
      });
      if (uploadBtn) {
        uploadBtn.dataset.onixWired = '1';
        uploadBtn.addEventListener('click', function(e){
          e.preventDefault();
          e.stopPropagation();
          openUploadModal({ scope: nav.cat });
        });
      }

      // Hide all children except the page header (the one containing the h1)
      [].slice.call(view.children).forEach(function(c){
        if (c === pageHd) return;
        if (c.style.display !== 'none') {
          c.dataset.onixHidden = '1';
          c.style.display = 'none';
        }
      });

      // Inject our root after the header
      var root = document.createElement('div');
      root.id = '__onix_docs_root';
      root.style.marginTop = '8px';
      pageHd.parentElement.insertBefore(root, pageHd.nextSibling);
      nav = {level:'root', cat:null};
      render();
    }

    // Watch for route changes — bundle toggles .view.active
    var mo = new MutationObserver(function(){
      if (window.__onix_docs_t) clearTimeout(window.__onix_docs_t);
      window.__onix_docs_t = setTimeout(takeover, 60);
    });
    setTimeout(function(){
      takeover();
      var observeRoot = document.querySelector('.main') || document.body;

        form.reset();

      });

    /* Filter bar injection */
    function injectFilter(){
      if (document.getElementById('__onix_app_filter')) return;
      var table = findAppsTable();
      if (!table) return;
      var wrap = table.closest('.card, .section, div') || table.parentElement;
      if (!wrap) return;
      var bar = document.createElement('div');
      bar.id = '__onix_app_filter';
      bar.innerHTML =
        '<span class="af-label">Filter:</span>' +
        '<input type="search" placeholder="Search borrower, address…" id="__onix_app_search">' +
        '<select id="__onix_app_status_filter"><option value="">All Statuses</option><option>Under Review</option><option>Pending</option><option>Approved</option><option>Declined</option></select>';
      wrap.insertBefore(bar, table);
      bar.querySelector('#__onix_app_search').addEventListener('input', applyFilter);
      bar.querySelector('#__onix_app_status_filter').addEventListener('change', applyFilter);
    }

    function findAppsTable(){
      var views = [document.getElementById('view-applications'), document.getElementById('view-loans-app')];
      for (var i=0; i<views.length; i++){
        if (views[i]) { var t = views[i].querySelector('table'); if (t) return t; }
      }
      // fallback: active view with "Applications" heading
      var hs = document.querySelectorAll('.view.active h1, .view.active h2, .main .active h1');
      for (var j=0; j<hs.length; j++){
        if (/applications/i.test(hs[j].textContent||'')){
          var t2 = hs[j].closest('.view,.main,section')&&hs[j].closest('.view,.main,section').querySelector('table');
          if (t2) return t2;
        }
      }
      return null;
    }

    function applyFilter(){
      var q = ((document.getElementById('__onix_app_search')||{}).value||'').toLowerCase();
      var st = ((document.getElementById('__onix_app_status_filter')||{}).value||'').toLowerCase();
      var table = findAppsTable();
      if (!table) return;
      [].slice.call(table.querySelectorAll('tbody tr')).forEach(function(tr){
        var txt = (tr.textContent||'').toLowerCase();
        var match = (!q || txt.indexOf(q) >= 0) && (!st || txt.indexOf(st) >= 0);
        tr.style.display = match ? '' : 'none';
      });
    }

    var mo = new MutationObserver(function(){
      clearTimeout(window.__onix_addapp_t);
      window.__onix_addapp_t = setTimeout(injectFilter, 120);
    });
    setTimeout(function(){
      if (window.__onix_injectSharedStyles) window.__onix_injectSharedStyles();
      injectStyles();
      buildModal();
      injectFilter();
      var root = document.querySelector('.main') || document.body;
      mo.observe(root, {subtree:true, childList:true, attributes:true, attributeFilter:['class']});
    }, 1600);

    document.addEventListener('click', function(e){
      var btn = e.target && e.target.closest && e.target.closest('button,a[role="button"]');
      if (!btn) return;
      var txt = (btn.textContent||'').trim();
      if (/add\s+application/i.test(txt)){
        e.preventDefault(); e.stopPropagation();
        var ov = document.getElementById('__onix_addapp_overlay');
        if (ov) ov.classList.add('show');
      }
      // Close buttons
      var closeId = btn.getAttribute('data-close');
      if (closeId) {
        var target = document.getElementById(closeId);
        if (target) window.__onix_closeOverlay(target);
      }
    }, true);
  });

      document.getElementById('__onix_lv_sub').textContent = loan.property;

    function cell(label, val, full){
      return '<div class="onix-info-cell' + (full ? ' full' : '') + '"><div class="ic-label">' + label + '</div><div class="ic-val">' + val + '</div></div>';
    }
    function escHtml(s){ return String(s||'').replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

    function findLoan(tr){
      var tds = tr.querySelectorAll('td');
      if (!tds.length) return null;
      var borrowerRaw = (tds[0].textContent||'').trim().replace(/^[A-Z]{2}(?=[A-Z][a-z])/,'').trim();
      var matched = LOAN_DATA.find(function(l){ return l.borrower.toLowerCase().indexOf(borrowerRaw.toLowerCase().slice(0,6)) >= 0; });
      if (matched) return matched;
      // Fallback: build from row cells
      return {
        borrower: borrowerRaw,
        amount: (tds[1]&&tds[1].textContent||'').trim(),
        property: (tds[2]&&tds[2].textContent||'').trim(),
        type: (tds[3]&&tds[3].textContent||'').trim(),
        rate: (tds[4]&&tds[4].textContent||'').trim(),
        ltv: (tds[5]&&tds[5].textContent||'').trim(),
        term: (tds[6]&&tds[6].textContent||'').trim(),
        status: 'Active',
        originated: '', maturity: '', lender: '', balance: '', payments: '', notes: ''
      };
    }

    setTimeout(function(){
      buildLoanModal();
    }, 1600);

    document.addEventListener('click', function(e){
      var btn = e.target && e.target.closest && e.target.closest('button');
      if (!btn || (btn.textContent||'').trim().toLowerCase() !== 'view') return;
      var tr = btn.closest('tr');
      if (!tr) return;
      // Check we're in a loans/active section (not clients)
      var parentView = tr.closest('[id]');
      if (parentView && /view-clients/i.test(parentView.id)) return;
      var headingEl = tr.closest('section,div,.view,.card');
      if (headingEl) {
        var heading = headingEl.querySelector('h1,h2,h3,h4');
        if (heading && /clients/i.test(heading.textContent||'')) return;
      }
      e.preventDefault(); e.stopPropagation();
      var loan = findLoan(tr);
      openLoan(loan);
    }, true);
  });

  /* =====================================================================
     RAISES — New Raise modal + Edit Raise modal

  window.addEventListener('load', function(){
    // Bumped key (was 'onix-raises') so previously-seeded demo rows in
    // localStorage stop appearing. Raises come from Supabase via
    // admin-portal-data.js's paintRaisesView.
    var RAISES_KEY = 'onix-raises-v2';
    var SEED_RAISES = [];
    try { localStorage.removeItem('onix-raises'); } catch (_) {}

    function loadRaises(){
      var r = null;
      try { r = JSON.parse(localStorage.getItem(RAISES_KEY)||'null'); } catch(_){}
      if (!r) { r = SEED_RAISES.map(function(x){return Object.assign({},x);}); saveRaises(r); }
      return r;
    }
    function saveRaises(a){ localStorage.setItem(RAISES_KEY, JSON.stringify(a)); }

    function raiseForm(raise){
      var v = raise || {};
      return '<form id="__onix_raise_form" autocomplete="off">' +
        '<div class="onix-row">' +
          '<div class="onix-field"><label>Investment / Project *</label><input name="investment" required value="' + esc(v.investment||'') + '" placeholder="e.g. Bari Caffè"></div>' +
          '<div class="onix-field"><label>Raise Type</label><select name="type"><option' + sel(v.type,'Equity') + '>Equity</option><option' + sel(v.type,'Debt') + '>Debt</option><option' + sel(v.type,'Mezzanine') + '>Mezzanine</option><option' + sel(v.type,'Preferred Equity') + '>Preferred Equity</option></select></div>' +
        '</div>' +
        '<div class="onix-row">' +
          '<div class="onix-field"><label>Target Amount *</label><input name="target" required value="' + esc(v.target||'') + '" placeholder="$500,000"></div>' +
          '<div class="onix-field"><label>Amount Raised</label><input name="raised" value="' + esc(v.raised||'$0') + '" placeholder="$0"></div>' +
        '</div>' +
        '<div class="onix-row">' +
          '<div class="onix-field"><label>Min Investment</label><input name="minInvest" value="' + esc(v.minInvest||'') + '" placeholder="$25,000"></div>' +
          '<div class="onix-field"><label>Target Close Date</label><input name="closeDate" type="date" value="' + esc(v.closeDate||'') + '"></div>' +
        '</div>' +
        '<div class="onix-row">' +
          '<div class="onix-field"><label>No. of Investors</label><input name="investors" type="number" min="0" value="' + esc(String(v.investors||'0')) + '"></div>' +
          '<div class="onix-field"><label>Status</label><select name="status"><option' + sel(v.status,'Active') + '>Active</option><option' + sel(v.status,'Closed') + '>Closed</option><option' + sel(v.status,'Paused') + '>Paused</option><option' + sel(v.status,'Draft') + '>Draft</option></select></div>' +
        '</div>' +
        '<div class="onix-field"><label>Notes</label><textarea name="notes" placeholder="Optional notes…">' + esc(v.notes||'') + '</textarea></div>' +
      '</form>';
    }

    function esc(s){ return String(s||'').replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
    function sel(cur, val){ return cur === val ? ' selected' : ''; }

    function collectRaiseForm(){
      var f = document.getElementById('__onix_raise_form');
      if (!f || !f.checkValidity()) { f&&f.reportValidity(); return null; }
      var fd = new FormData(f);
      return {
        investment: (fd.get('investment')||'').toString().trim(),
        type:       (fd.get('type')||'Equity').toString(),
        target:     (fd.get('target')||'').toString().trim(),
        raised:     (fd.get('raised')||'$0').toString().trim(),
        minInvest:  (fd.get('minInvest')||'').toString().trim(),
        closeDate:  (fd.get('closeDate')||'').toString(),
        investors:  parseInt(fd.get('investors')||'0',10),
        status:     (fd.get('status')||'Active').toString(),
        notes:      (fd.get('notes')||'').toString().trim(),
      };
    }

    /* New Raise modal */
    function buildNewRaiseModal(){
      var overlay = window.__onix_createOverlay('__onix_newraise_overlay');
      overlay.innerHTML =
        '<div class="onix-sheet">' +
          '<div class="onix-sheet-hd">' +
            '<div><div class="o-eyebrow">Raises</div><h2>New Raise</h2><div class="o-sub">Create a new capital raise for an investment.</div></div>' +
            '<button class="onix-sheet-close" type="button" id="__onix_nr_close">×</button>' +
          '</div>' +
          '<div class="onix-sheet-body">' + raiseForm(null) + '</div>' +
          '<div class="onix-actions">' +
            '<button class="onix-btn onix-btn-ghost" id="__onix_nr_cancel" type="button">Cancel</button>' +
            '<button class="onix-btn onix-btn-primary" id="__onix_nr_submit" type="button">Create Raise</button>' +
          '</div>' +
        '</div>';

      function closeNR(){ window.__onix_closeOverlay(overlay); }
      overlay.querySelector('#__onix_nr_close').addEventListener('click', closeNR);
      overlay.querySelector('#__onix_nr_cancel').addEventListener('click', closeNR);
      overlay.querySelector('#__onix_nr_submit').addEventListener('click', function(){
        var data = collectRaiseForm(); if (!data) return;
        data.id = 'R-' + Date.now().toString(36).toUpperCase().slice(-4);
        var list = loadRaises(); list.push(data); saveRaises(list);
        window.__onix_showToast('Raise for <b>' + data.investment + '</b> created.', '#3B8B3B');
        closeNR();
        injectRaiseRows();
      });
    }

    /* Edit Raise modal */
    function buildEditRaiseModal(){
      if (document.getElementById('__onix_editraise_overlay')) return;
      var overlay = window.__onix_createOverlay('__onix_editraise_overlay');
      overlay.innerHTML =
        '<div class="onix-sheet">' +
          '<div class="onix-sheet-hd">' +
            '<div><div class="o-eyebrow">Raises</div><h2>Edit Raise</h2><div class="o-sub" id="__onix_er_sub"></div></div>' +
            '<button class="onix-sheet-close" type="button" id="__onix_er_close">×</button>' +
          '</div>' +
          '<div class="onix-sheet-body" id="__onix_er_body"></div>' +
          '<div class="onix-actions">' +
            '<button class="onix-btn onix-btn-ghost" id="__onix_er_cancel" type="button">Cancel</button>' +
            '<button class="onix-btn onix-btn-primary" id="__onix_er_submit" type="button">Save Changes</button>' +
          '</div>' +
        '</div>';
      function closeER(){ window.__onix_closeOverlay(overlay); }
      overlay.querySelector('#__onix_er_close').addEventListener('click', closeER);
      overlay.querySelector('#__onix_er_cancel').addEventListener('click', closeER);
    }

    function openEditRaise(raiseId, raiseData){
      buildEditRaiseModal();
      var overlay = document.getElementById('__onix_editraise_overlay');
      document.getElementById('__onix_er_sub').textContent = 'Editing: ' + (raiseData.investment || raiseId);
      document.getElementById('__onix_er_body').innerHTML = raiseForm(raiseData);

      var submitBtn = overlay.querySelector('#__onix_er_submit');
      // Remove any old listener
      var newBtn = submitBtn.cloneNode(true);
      submitBtn.parentNode.replaceChild(newBtn, submitBtn);
      newBtn.addEventListener('click', function(){
        var data = collectRaiseForm(); if (!data) return;
        data.id = raiseId;
        var list = loadRaises();
        var idx = list.findIndex(function(r){ return r.id === raiseId; });
        if (idx >= 0) list[idx] = data; else list.push(data);
        saveRaises(list);
        window.__onix_showToast('Raise for <b>' + data.investment + '</b> updated.', '#3B8B3B');
        window.__onix_closeOverlay(overlay);
        injectRaiseRows();
      });
      overlay.classList.add('show');
    }

    /* Inject raise rows from localStorage into the raises table */
    function injectRaiseRows(){
      var view = findRaisesView();
      if (!view) return;
      var tbody = view.querySelector('table tbody');
      if (!tbody) return;
      var stored = loadRaises();
      if (!stored.length) return;
      // Keep original rows; append only stored rows not already present
      var existingIds = new Set([].slice.call(tbody.querySelectorAll('tr[data-raise-id]')).map(function(tr){ return tr.getAttribute('data-raise-id'); }));
      stored.forEach(function(r){
        if (existingIds.has(r.id)) return;
        var tr = document.createElement('tr');
        tr.setAttribute('data-raise-id', r.id);
        var statusClass = r.status === 'Active' ? 'active' : r.status === 'Closed' ? 'closed' : 'pending';
        tr.innerHTML =
          '<td>' + esc(r.investment) + '</td>' +
          '<td>' + esc(r.type) + '</td>' +
          '<td>' + esc(r.target) + '</td>' +
          '<td>' + esc(r.raised) + '</td>' +
          '<td>' + (r.investors||0) + '</td>' +
          '<td><span class="onix-status-badge ' + statusClass + '">' + esc(r.status) + '</span></td>' +
          '<td><button class="onix-btn onix-btn-ghost" style="padding:6px 12px;font-size:.64rem" data-edit-raise="' + esc(r.id) + '">Edit</button></td>';
        tbody.appendChild(tr);
      });
    }

    function findRaisesView(){
      var byId = document.getElementById('view-raises') || document.getElementById('view-portfolio');
      if (byId) return byId;
      var hs = document.querySelectorAll('.view.active h1, .view.active h2');
      for (var i=0;i<hs.length;i++){
        if (/raises/i.test(hs[i].textContent||'')) return hs[i].closest('.view,.main,section');
      }
      return null;
    }

    var mo = new MutationObserver(function(){
      clearTimeout(window.__onix_raise_t);
      window.__onix_raise_t = setTimeout(injectRaiseRows, 120);
    });

    setTimeout(function(){
      buildNewRaiseModal();
      injectRaiseRows();
      var root = document.querySelector('.main') || document.body;
      mo.observe(root, {subtree:true, childList:true, attributes:true, attributeFilter:['class']});
    }, 1600);

    document.addEventListener('click', function(e){
      var btn = e.target && e.target.closest && e.target.closest('button,a[role="button"]');
      if (!btn) return;
      var txt = (btn.textContent||'').trim();
      // New Raise
      if (/new\s+raise/i.test(txt)){
        e.preventDefault(); e.stopPropagation();
        var ov = document.getElementById('__onix_newraise_overlay');
        if (ov) ov.classList.add('show');
        return;
      }
      // Edit button with data-edit-raise attribute
      var editId = btn.getAttribute('data-edit-raise');
      if (editId){
        e.preventDefault(); e.stopPropagation();
        var raises = loadRaises();
        var raise = raises.find(function(r){ return r.id === editId; });
        if (raise) openEditRaise(editId, raise);
        return;
      }
      // Edit button in raises table (by text + context)
      if (/^edit$/i.test(txt)){
        var tr = btn.closest('tr');
        if (!tr) return;
        var raiseView = findRaisesView();
        if (!raiseView || !raiseView.contains(tr)) return;
        e.preventDefault(); e.stopPropagation();
        var cells = tr.querySelectorAll('td');
        var name = (cells[0]&&cells[0].textContent||'').trim();
        var raises2 = loadRaises();
        var found = raises2.find(function(r){ return r.investment && r.investment.toLowerCase().indexOf(name.toLowerCase().slice(0,5)) >= 0; });
        if (!found) {
          // Build from row data
          found = {
            id: 'R-' + name.replace(/\s/g,'-').slice(0,8),
            investment: name,
            type: (cells[1]&&cells[1].textContent||'').trim(),
            target: (cells[2]&&cells[2].textContent||'').trim(),
            raised: (cells[3]&&cells[3].textContent||'').trim(),
            investors: parseInt((cells[4]&&cells[4].textContent||'0').trim(),10)||0,
            status: (cells[5]&&cells[5].textContent||'').trim(),
            minInvest:'', closeDate:'', notes:''
          };
        }

      zone.addEventListener('dragleave', function(){ zone.classList.remove('drag'); });
      zone.addEventListener('drop', function(e){

        if (window.OnixPerms && !OnixPerms.can('manageUsers')) {
          window.__onix_showToast && window.__onix_showToast('Your role does not have permission to manage users.', '#C0392B');
          return;
        }
        var form = document.getElementById('__onix_inv_form');
        if (!form.checkValidity()) { form.reportValidity(); return; }
        var fd = new FormData(form);
        var roleVal = (fd.get('role')||'').toString();
        var roleLabel = roleVal === 'admin' ? 'Admin' : roleVal === 'manager' ? 'Manager' : 'Account Executive';
        var first = (fd.get('first')||'').toString().trim();
        var last  = (fd.get('last')||'').toString().trim();
        var email = (fd.get('email')||'').toString().trim();
        var fullName = (first + ' ' + last).trim();

        var submitBtn = document.getElementById('__onix_inv_submit');

          if (!window.OnixDB || !OnixDB.client) throw new Error('Supabase not loaded');
          // Calls the invite-team-member edge function (sends a real email with
          // a tokenized accept link). The user's admin JWT is attached by the
          // supabase-js functions client automatically.
          var resp = await OnixDB.client.functions.invoke('invite-team-member', {
            body: { email: email, full_name: fullName, title: roleVal }
          });
          if (resp.error) {
            // Try to surface the function's JSON error message
            var detail = '';
            try { detail = (await resp.error.context.json()).error; } catch(_){}
            throw new Error(detail || resp.error.message || 'Invite failed');
          }
          var data = resp.data || {};
          var member = {
            id: 'U-' + Date.now().toString(36).toUpperCase().slice(-5),
            first: first, last: last, email: email,
            role: roleVal, roleLabel: roleLabel,

        '<td><span style="background:#FDF1E6;color:#B8651A;font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:2px">Invited</span></td>';
      tbody.appendChild(tr);
      // Trigger role-ization
      setTimeout(function(){
        if (window.__onix_team_t) clearTimeout(window.__onix_team_t);
        window.__onix_team_t = setTimeout(function(){

          document.dispatchEvent(mo_dummy);

    function escHtml(s){ return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
    function hexBg(hex){
      try{
        var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
        return 'rgba('+r+','+g+','+b+',.12)';
      } catch(_){ return '#F8F7F5'; }
    }

    // Restore previously invited members
    function restoreMembers(){
      var stored = loadMembers();
      stored.forEach(function(m){ injectMemberRow(m); });
    }

    var mo = new MutationObserver(function(){
      clearTimeout(window.__onix_inv_t);

          return;

  /* =====================================================================
     TEAM & SETTINGS — Pending Team Members (approve / decline)
     Reads pending rows from the team_invites table and lets an admin
     approve (activate the account with a temp password they hand off)
     or decline (revoke the invite). No email dependency.
     ===================================================================== */
  window.addEventListener('load', function(){
    var PANEL_ID = '__onix_pending_team';

    function makeTempPassword(){
      // Readable, >= 8 chars, mixed case + digits. Admin shares this once.
      var letters = 'ABCDEFGHJKMNPQRSTUVWXYZ';
      var lower   = 'abcdefghijkmnpqrstuvwxyz';
      var digits  = '23456789';
      function pick(s,n){ var o=''; for(var i=0;i<n;i++) o+=s[Math.floor(Math.random()*s.length)]; return o; }
      return 'Onix-' + pick(letters,2) + pick(lower,3) + pick(digits,4);
    }

    function esc(s){ return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

    function titleLabel(t){ return t==='admin'?'Admin':t==='manager'?'Manager':t==='ae'?'Account Executive':(t||'Member'); }

    function ensureCard(){
      var view = document.getElementById('view-users');
      if (!view) return null;
      var card = document.getElementById(PANEL_ID);
      if (card) return card;
      card = document.createElement('div');
      card.id = PANEL_ID;
      card.style.cssText = 'background:#fff;border:1px solid #E8E8E8;border-top:3px solid #C0392B;padding:24px 28px;margin-bottom:22px;font-family:"DM Sans",-apple-system,sans-serif';
      var header = view.querySelector('.page-hd');
      if (header && header.parentElement === view) header.after(card);
      else view.insertBefore(card, view.firstChild);
      return card;
    }

    async function loadPending(){
      if (!window.OnixDB || !OnixDB.client) return;
      var card = ensureCard();
      if (!card) return;
      var res = await OnixDB.client
        .from('team_invites')
        .select('id, email, full_name, title, created_at, token')
        .eq('status', 'pending')
        .order('created_at', { ascending: false });
      if (res.error) { card.style.display='none'; return; }
      var rows = res.data || [];
      if (!rows.length) { card.style.display = 'none'; return; }

        '<div style="font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:#6B6560;font-weight:700;margin-bottom:4px">Pending Team Members</div>' +

              '<td style="padding:10px;border-bottom:1px solid #F2F2F2">'+esc(titleLabel(r.title))+'</td>' +
              '<td style="padding:10px;border-bottom:1px solid #F2F2F2;text-align:right;white-space:nowrap">' +
                '<button class="__onix_pt_approve" style="background:#C0392B;color:#fff;border:1px solid #C0392B;padding:7px 13px;font:600 .68rem/1 \'DM Sans\',sans-serif;text-transform:uppercase;letter-spacing:.06em;border-radius:2px;cursor:pointer;margin-right:6px">Approve</button>' +
                '<button class="__onix_pt_decline" style="background:#fff;color:#1A1A1A;border:1px solid #E8E8E8;padding:7px 13px;font:600 .68rem/1 \'DM Sans\',sans-serif;text-transform:uppercase;letter-spacing:.06em;border-radius:2px;cursor:pointer">Decline</button>' +

        btn.addEventListener('click', function(){ decline(btn.closest('tr')); });

    async function approve(tr){
      if (!tr) return;
      var token = tr.getAttribute('data-token');
      var email = tr.getAttribute('data-email');
      var btns = tr.querySelectorAll('button');
      btns.forEach(function(b){ b.disabled = true; });
      var tempPw = makeTempPassword();
      try {
        // Reuse the accept-team-invite edge function: admin sets a temp
        // password on the member's behalf (no email needed).
        var SUPA = OnixDB.client;
        var resp = await SUPA.functions.invoke('accept-team-invite', {
          body: { token: token, password: tempPw }
        });
        if (resp.error) {
          var detail=''; try { detail=(await resp.error.context.json()).error; } catch(_){}
          throw new Error(detail || resp.error.message || 'Approve failed');
        }
        // Sticky toast — admin needs time to copy the temp password before
        // it disappears, so it stays up until they click ×.
        window.__onix_showToast(
          'Approved <b>'+esc(email)+'</b>. Share this temporary password so they can sign in:<br>' +
          '<span style="font-family:monospace;font-size:.9rem;background:#fff;color:#C0392B;padding:2px 8px;border-radius:2px;display:inline-block;margin-top:6px;user-select:all">'+esc(tempPw)+'</span>' +
          '<div style="font-size:.7rem;color:#bbb;margin-top:8px;font-style:italic">Click the password to select it. Close this when you have it copied.</div>',
          '#3B8B3B',
          { sticky: true }
        );
        loadPending();
        renderActiveTeam();   // show the newly-approved member in the team list
      } catch (err) {
        window.__onix_showToast('Could not approve: ' + (err && err.message ? err.message : err), '#C0392B');
        btns.forEach(function(b){ b.disabled = false; });
      }
    }

    // Initials for the mini-avatar in the team table.
    function teamInitials(name){
      var p = String(name||'').trim().split(/\s+/).filter(Boolean);
      if (!p.length) return '??';
      return ((p[0][0]||'') + (p.length>1 ? p[p.length-1][0] : '')).toUpperCase();
    }
    function teamRoleStyle(t){
      return t==='admin'   ? {bg:'#FDF0EE',fg:'#C0392B'} :
             t==='manager' ? {bg:'#FDF1E6',fg:'#B8651A'} :
                             {bg:'#EBF5EB',fg:'#2D6B2D'};
    }

    // Paint active admin accounts (incl. newly-approved members) into the
    // Team & Settings members table. Dedupes by email so demo rows and
    // repeated renders don't double up.
    async function renderActiveTeam(){
      if (!window.OnixDB || !OnixDB.client) return;
      var view = document.getElementById('view-users');
      if (!view) return;
      var table = Array.prototype.slice.call(view.querySelectorAll('table.tbl'))
        .find(function(t){ var h=t.querySelector('thead'); return h && /Last Login/i.test(h.textContent||''); });
      if (!table) return;
      var tbody = table.querySelector('tbody');
      if (!tbody) return;
      var res = await OnixDB.client.from('profiles')
        .select('email, full_name, title, role, status, created_at')
        .in('role', ['admin', 'manager']).eq('status', 'active')
        .order('created_at', { ascending: true });
      if (res.error) return;
      // Remove demo/hardcoded rows (any row not tagged data-team-email) so only
      // real team members from Supabase are shown.
      Array.prototype.slice.call(tbody.querySelectorAll('tr'))
        .forEach(function(tr){ if (!tr.hasAttribute('data-team-email')) tr.remove(); });
      var TEAM_ROLES = [
        { key:'admin',   label:'Admin' },
        { key:'manager', label:'Manager' },
        { key:'ae',      label:'Account Executive' }
      ];
      (res.data || []).forEach(function(m){
        var already = Array.prototype.slice.call(tbody.querySelectorAll('tr'))
          .some(function(tr){ return (tr.textContent||'').toLowerCase().indexOf((m.email||'').toLowerCase()) >= 0; });
        if (already) return;
        var current = (m.role === 'manager') ? 'manager' : (m.title === 'ae') ? 'ae' : 'admin';
        var tr = document.createElement('tr');
        tr.setAttribute('data-team-email', m.email);
        tr.innerHTML =
          '<td><span class="mini-avatar">'+esc(teamInitials(m.full_name||m.email))+'</span>'+esc(m.full_name||'—')+'</td>' +
          '<td>'+esc(m.email)+'</td>' +
          '<td class="__onix_role_cell"></td>' +
          '<td>—</td>' +
          '<td class="__onix_status_cell"><span style="background:#EBF5EB;color:#2D6B2D;font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:2px">Active</span></td>';

        // Role dropdown — same look as the existing team rows. Mark the cell
        // roleized so the other takeover() handler skips it. Changes persist
        // to profiles.title in the DB.
        var roleTd = tr.querySelector('.__onix_role_cell');
        roleTd.dataset.onixRoleized = '1';
        var sel = document.createElement('select');
        sel.className = '__onix_role_select role-' + current;
        sel.dataset.email = m.email;
        TEAM_ROLES.forEach(function(r){
          var o = document.createElement('option');
          o.value = r.key; o.textContent = r.label;
          if (r.key === current) o.selected = true;
          sel.appendChild(o);
        });
        sel.addEventListener('change', async function(){
          if (window.OnixPerms && !OnixPerms.can('manageUsers')) {
            window.__onix_showToast && window.__onix_showToast('Your role does not have permission to manage users.', '#C0392B');
            sel.value = current; sel.className = '__onix_role_select role-' + current;
            return;
          }
          sel.className = '__onix_role_select role-' + sel.value;
          var prev = current;
          current = sel.value;
          // Save BOTH role and title so the read logic on refresh matches
          // (see the m.role === 'manager' / m.title === 'ae' check above).
          // Manager needs role='manager' at the DB level so it survives a
          // reload; admin/AE both use role='admin' with title distinguishing.
          var patch =
            sel.value === 'manager' ? { role: 'manager', title: 'manager' } :
            sel.value === 'ae'      ? { role: 'admin',   title: 'ae' } :
                                      { role: 'admin',   title: 'admin' };
          var r = await OnixDB.client.from('profiles').update(patch).eq('email', m.email);
          if (r.error) {
            window.__onix_showToast('Could not change role: ' + r.error.message, '#C0392B');
            sel.value = prev; current = prev; sel.className = '__onix_role_select role-' + prev;
          } else {
            window.__onix_showToast('Role updated for <b>'+esc(m.email)+'</b>.', '#3B8B3B');
          }
        });
        roleTd.appendChild(sel);

        // Remove button in the status cell — revokes admin access (sets the
        // profile status to rejected, which the requireAdmin gate blocks).
        var statusTd = tr.querySelector('.__onix_status_cell');
        var rm = document.createElement('button');
        rm.textContent = 'Remove';
        rm.setAttribute('data-onix-remove', '1');
        rm.style.cssText = 'margin-left:10px;background:#fff;color:#C0392B;border:1px solid #E8E8E8;padding:5px 11px;font:600 .64rem/1 \'DM Sans\',sans-serif;text-transform:uppercase;letter-spacing:.06em;border-radius:2px;cursor:pointer';
        rm.addEventListener('click', async function(){
          if (window.OnixPerms && !OnixPerms.can('manageUsers')) {
            window.__onix_showToast && window.__onix_showToast('Your role does not have permission to manage users.', '#C0392B');
            return;
          }
          if (!confirm('Remove ' + (m.full_name || m.email) + ' from the team? They will lose admin access.')) return;
          rm.disabled = true;
          var removed = loadRemoved();
          if (removed.indexOf((m.email||'').toLowerCase()) < 0) { removed.push((m.email||'').toLowerCase()); saveRemoved(removed); }
          var r = await OnixDB.client.from('profiles').update({ status: 'rejected' }).eq('email', m.email);
          if (r.error) {
            window.__onix_showToast('Could not remove: ' + r.error.message, '#C0392B');
            rm.disabled = false;
          } else {
            window.__onix_showToast('Removed <b>'+esc(m.email)+'</b> from the team.', '#6B6560');
            tr.remove();
          }
        });
        statusTd.appendChild(rm);

        tbody.appendChild(tr);
      });

      // Make sure EVERY row (including the bundled demo rows) has a Remove button.
      addRemoveToAllRows(table);
      applyRemovedFilter(table);
    }

    // localStorage set of emails the admin has removed (covers demo rows that
    // would otherwise re-appear from the bundled HTML on every load).
    var REMOVED_KEY = 'onix-removed-team';
    function loadRemoved(){ try { return JSON.parse(localStorage.getItem(REMOVED_KEY)||'[]')||[]; } catch(_){ return []; } }
    function saveRemoved(a){ localStorage.setItem(REMOVED_KEY, JSON.stringify(a)); }

    function rowEmail(tr){
      var td = tr.children[1];
      return td ? (td.textContent||'').trim().toLowerCase() : '';
    }

    // Hide any row whose email the admin previously removed.
    function applyRemovedFilter(table){
      if (!table) return;
      var removed = loadRemoved();
      Array.prototype.slice.call(table.querySelectorAll('tbody tr')).forEach(function(tr){
        if (removed.indexOf(rowEmail(tr)) >= 0) tr.remove();
      });
    }

    // Add a Remove button to every team row that doesn't already have one.
    function addRemoveToAllRows(table){
      if (!table) return;
      Array.prototype.slice.call(table.querySelectorAll('tbody tr')).forEach(function(tr){
        if (tr.querySelector('[data-onix-remove]')) return;       // already has one (DB rows)
        var lastTd = tr.children[tr.children.length - 1];
        if (!lastTd) return;
        var email = rowEmail(tr);
        if (!email) return;
        var rm = document.createElement('button');
        rm.textContent = 'Remove';
        rm.setAttribute('data-onix-remove', '1');
        rm.style.cssText = 'margin-left:10px;background:#fff;color:#C0392B;border:1px solid #E8E8E8;padding:5px 11px;font:600 .64rem/1 \'DM Sans\',sans-serif;text-transform:uppercase;letter-spacing:.06em;border-radius:2px;cursor:pointer';
        rm.addEventListener('click', async function(){
          var name = (tr.children[0] && tr.children[0].textContent || email).trim();
          if (!confirm('Remove ' + name + ' from the team? They will lose admin access.')) return;
          rm.disabled = true;
          // Persist removal for demo rows, and revoke access for real accounts.
          var removed = loadRemoved();
          if (removed.indexOf(email) < 0) { removed.push(email); saveRemoved(removed); }
          if (window.OnixDB && OnixDB.client) {
            // Harmless no-op if this email isn't a real profile.
            await OnixDB.client.from('profiles').update({ status: 'rejected' }).eq('email', email);
          }
          window.__onix_showToast('Removed <b>'+esc(email)+'</b> from the team.', '#6B6560');
          tr.remove();
        });
        lastTd.appendChild(rm);
      });
    }

    async function decline(tr){
      if (!tr) return;
      var id = tr.getAttribute('data-invite-id');
      var email = tr.getAttribute('data-email');
      if (!confirm('Decline the invitation for ' + email + '? They will not be able to join.')) return;
      var btns = tr.querySelectorAll('button');
      btns.forEach(function(b){ b.disabled = true; });
      try {
        var res = await OnixDB.client.from('team_invites')
          .update({ status: 'revoked' }).eq('id', id);
        if (res.error) throw new Error(res.error.message);
        window.__onix_showToast('Declined the invitation for <b>'+esc(email)+'</b>.', '#6B6560');
        loadPending();
      } catch (err) {
        window.__onix_showToast('Could not decline: ' + (err && err.message ? err.message : err), '#C0392B');
        btns.forEach(function(b){ b.disabled = false; });
      }
    }

    // Add Remove buttons + apply the removed filter to whatever team table
    // exists right now (independent of the DB query in renderActiveTeam, so
    // demo rows get the button even if Supabase is slow/unavailable).
    function decorateTeamTable(){
      var view = document.getElementById('view-users');
      if (!view) return;
      var table = Array.prototype.slice.call(view.querySelectorAll('table.tbl'))
        .find(function(t){ var h=t.querySelector('thead'); return h && /Last Login/i.test(h.textContent||''); });
      if (!table) return;
      addRemoveToAllRows(table);
      applyRemovedFilter(table);
    }

    // Initial load + refresh whenever the Team view is shown.
    setTimeout(function(){ loadPending(); renderActiveTeam(); decorateTeamTable(); }, 1900);
    setTimeout(decorateTeamTable, 2600); // catch late-injected demo rows
    document.addEventListener('click', function(e){
      var t = e.target && e.target.closest && e.target.closest('[data-view="users"], [href="#users"], .nav-item');
      if (t) setTimeout(function(){ loadPending(); renderActiveTeam(); decorateTeamTable(); }, 300);
    }, true);
  });

  window.addEventListener('load', function(){
    function removeBillingColumn(){
      var card = document.getElementById('__onix_perm_card');
      if (!card) return;
      var table = card.querySelector('table');
      if (!table) return;
      var headers = [].slice.call(table.querySelectorAll('thead th'));
      var billingIdx = -1;
      headers.forEach(function(th, i){ if (/billing/i.test(th.textContent||'')) billingIdx = i; });
      if (billingIdx < 0) return;
      // Remove header
      headers[billingIdx].remove();
      // Remove each body cell at same index
      [].slice.call(table.querySelectorAll('tbody tr')).forEach(function(tr){
        var cells = [].slice.call(tr.querySelectorAll('td'));
        if (cells[billingIdx]) cells[billingIdx].remove();
      });
      card.dataset.billingRemoved = '1';
    }

    var mo = new MutationObserver(function(){
      var card = document.getElementById('__onix_perm_card');
      if (card && card.dataset.billingRemoved !== '1') removeBillingColumn();
    });
    setTimeout(function(){
      removeBillingColumn();
      var root = document.querySelector('#__onix_perm_card') || document.querySelector('.main') || document.body;
      mo.observe(root.parentElement || document.body, {subtree:true, childList:true});
    }, 2000);
  });

  window.addEventListener('load', function(){
    function buildContactModal(){
      if (document.getElementById('__onix_contact_overlay')) return;
      var overlay = window.__onix_createOverlay('__onix_contact_overlay');
      overlay.innerHTML =
        '<div class="onix-sheet">' +
          '<div class="onix-sheet-hd">' +
            '<div><div class="o-eyebrow">Outreach</div><h2>Contact</h2><div class="o-sub" id="__onix_ct_sub">Send a message or log a call.</div></div>' +

              '<div class="onix-field"><label>Name</label><input id="__onix_ct_name" readonly style="background:#F8F7F5"></div>' +

            '<div class="onix-field"><label>Message / Notes</label><textarea id="__onix_ct_msg" placeholder="Message or call notes to log…"></textarea></div>' +
            '<div class="onix-field"><label>Schedule Follow-up (optional)</label><input id="__onix_ct_followup" type="date"></div>' +
          '</div>' +
          '<div class="onix-actions">' +
            '<button class="onix-btn onix-btn-ghost" id="__onix_ct_cancel" type="button">Cancel</button>' +
            '<button class="onix-btn onix-btn-primary" id="__onix_ct_send" type="button">Send & Log</button>' +
          '</div>' +
        '</div>';

      function closeModal(){
        window.__onix_closeOverlay(overlay);
        document.getElementById('__onix_ct_msg').value = '';
        document.getElementById('__onix_ct_subject').value = '';
      }
      overlay.querySelector('#__onix_ct_close').addEventListener('click', closeModal);
      overlay.querySelector('#__onix_ct_cancel').addEventListener('click', closeModal);
      overlay.querySelector('#__onix_ct_send').addEventListener('click', function(){
        var name = document.getElementById('__onix_ct_name').value || 'Contact';
        var method = document.getElementById('__onix_ct_method').value;
        window.__onix_showToast('<b>' + method + '</b> logged for ' + name + '.', '#3B8B3B');
        closeModal();
      });
    }

    function openContact(name, email){
      buildContactModal();
      document.getElementById('__onix_ct_name').value = name || '';
      document.getElementById('__onix_ct_email').value = email || '';
      document.getElementById('__onix_ct_sub').textContent = name ? 'Contacting ' + name : 'Send a message or log a call.';
      var overlay = document.getElementById('__onix_contact_overlay');
      overlay.classList.add('show');
    }

    // Parse borrower name from the row
    function getRowContact(tr){
      if (!tr) return {name:'', email:''};
      var first = (tr.children[0] && tr.children[0].textContent || '').trim().replace(/^[A-Z]{2}(?=[A-Z][a-z])/,'');
      var emailCell = tr.children[1];
      var email = emailCell && /@/.test(emailCell.textContent||'') ? (emailCell.textContent||'').trim() : '';
      return {name: first, email: email};
    }

    setTimeout(function(){ buildContactModal(); }, 1600);

    document.addEventListener('click', function(e){
      var btn = e.target && e.target.closest && e.target.closest('button');
      if (!btn) return;
      var txt = (btn.textContent||'').trim();
      if (!/^contact(\s+applicant)?$/i.test(txt) && !/^opening contact/i.test(btn.getAttribute('onclick')||'')) return;
      // Check the onclick attribute
      var oc = btn.getAttribute('onclick') || '';
      if (!/contact/i.test(txt) && !/contact/i.test(oc)) return;
      e.preventDefault(); e.stopPropagation();
      var tr = btn.closest('tr');
      var contact = getRowContact(tr);
      // Try to extract name from onclick attr like alert('Contacting Patricia Chen')
      var m = oc.match(/Contacting\s+(.+?)['"\)]/i);
      if (m) contact.name = m[1];
      m = oc.match(/contact for\s+(.+?)['"\)]/i);
      if (m) contact.name = m[1];
      openContact(contact.name, contact.email);
    }, true);
  });

document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }
